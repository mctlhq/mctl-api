openapi: "3.0.3"
info:
  title: mctl API
  version: "1.0.0"
  description: |
    REST API for the mctl.ai Internal Developer Platform.

    ## Authentication

    All `/api/v1/*` endpoints require a `Bearer` token in the `Authorization` header.
    Two token types are accepted:

    - **GitHub personal access token** — validated against the GitHub API.
      Required scopes: `read:user` (for identity). Membership in your team is resolved
      from the GitOps repo.
    - **Dex JWT** — issued by the platform SSO at `ops.mctl.ai`. Obtained via Backstage
      login or the `/mcp` OAuth flow on `mctl.me`.

    ```
    Authorization: Bearer ghp_xxxxxxxxxxxx
    Authorization: Bearer eyJhbGciOiJSUzI1NiJ9...
    ```

    ## Rate Limits

    - Authenticated routes (including `POST /mcp`): **300 requests/minute** per authenticated user
    - Loopback MCP-internal REST (`127.0.0.1`, `::1`) is excluded from that cap so in-process REST does not double-count with `POST /mcp`
    - Write endpoints (`/operations/*/execute` and related): **20 requests/minute** per authenticated user. Loopback is not excluded from the write cap.

    ## MCP Integration

    In addition to the REST API, all operations are available as MCP tools at `POST /mcp`.
    Configure your AI client with `https://api.mctl.ai` as the MCP server URL.

servers:
  - url: https://api.mctl.ai
    description: Production
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: GitHub personal access token or Dex JWT

  schemas:
    Tenant:
      type: object
      properties:
        name:
          type: string
          example: billing
        displayName:
          type: string
          example: Billing Team
        description:
          type: string
        contactEmail:
          type: string
          format: email
        quotas:
          type: object
          additionalProperties:
            type: string
          example:
            cpu: "2"
            memory: 4Gi
            pods: "10"
        members:
          type: array
          items:
            $ref: '#/components/schemas/TenantMember'

    TenantMember:
      type: object
      properties:
        userId:
          type: string
          example: alice
        role:
          type: string
          example: admin

    Service:
      type: object
      properties:
        team:
          type: string
          example: billing
        name:
          type: string
          example: payment-api
        imageTag:
          type: string
          example: "1.2.3"
        host:
          type: string
          example: payment-api.mctl.ai
        port:
          type: string
          example: "8080"
        componentType:
          type: string
          enum: [base-service, worker-service]
        hasDatabase:
          type: boolean

    ArgoStatus:
      type: object
      properties:
        name:
          type: string
        syncStatus:
          type: string
          enum: [Synced, OutOfSync, Unknown]
        healthStatus:
          type: string
          enum: [Healthy, Progressing, Degraded, Suspended, Missing, Unknown]
        message:
          type: string

    WorkflowStatus:
      type: object
      properties:
        workflow:
          type: string
        audit:
          $ref: '#/components/schemas/AuditEntry'
        note:
          type: string

    AuditEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
        operation:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        workflowName:
          type: string
        status:
          type: string
          enum: [submitted, succeeded, failed]
        riskLevel:
          type: string
          enum: [low, medium, high]
        message:
          type: string
        clientIp:
          type: string
          description: Client IP. X-Forwarded-For is used only when the peer is a configured Traefik CIDR.
        userAgent:
          type: string
        requestId:
          type: string

    ResourceUsage:
      type: object
      properties:
        tenant:
          type: string
        allocated:
          type: object
          additionalProperties:
            type: string
        used:
          type: object
          additionalProperties:
            type: string
        note:
          type: string

    LogLine:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        line:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string

    Operation:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        workflowTemplate:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
        requiresConfirm:
          type: boolean
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDef'

    ParameterDef:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        default:
          type: string
        description:
          type: string
        enum:
          type: array
          items:
            type: string

    ExecuteRequest:
      type: object
      description: Key-value map of operation parameters
      additionalProperties:
        type: string
      example:
        team_name: billing
        component_name: payment-api
        action: deploy
        git_tag: "1.2.3"

    ExecuteResponse:
      type: object
      properties:
        workflowName:
          type: string
          example: deploy-service-abc12
        operation:
          type: string
        status:
          type: string
          example: submitted
        message:
          type: string

    PlatformSkillMetadata:
      type: object
      properties:
        name:
          type: string
          example: mctl-platform
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, tenant, admin, platform-internal]
        status:
          type: string
          enum: [draft, active, deprecated]
        owner:
          type: string
        runtimes:
          type: array
          items:
            type: string
          example: [claude, codex]

    PlatformSkill:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/PlatformSkillMetadata'
        hasContent:
          type: boolean
        size:
          type: integer
        lastModified:
          type: string
          format: date-time

    PlatformSkillBinding:
      type: object
      properties:
        tenant:
          type: string
          example: nfc
        role:
          type: string
          example: admins
        enabledSkills:
          type: array
          items:
            type: string

    PlatformSkillWorkflowResponse:
      type: object
      properties:
        operation:
          type: string
          example: platform-skill-enable
        workflow:
          type: object
          properties:
            workflowName:
              type: string
            namespace:
              type: string
            requestId:
              type: string
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    AgentDefinition:
      type: object
      properties:
        name:
          type: string
          example: issue-investigator
        description:
          type: string
        owner:
          type: string
          example: mctl-agents
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true

    AgentVersion:
      type: object
      properties:
        id:
          type: integer
        agent:
          type: string
          example: issue-investigator
        version:
          type: string
          example: 1.0.0
        manifest_json:
          type: string
          description: The published AgentManifest (agent.yaml), as JSON
        git_sha:
          type: string
        image_repository:
          type: string
          example: ghcr.io/mctlhq/mctl-agents
        image_digest:
          type: string
        prompt_hash:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string

    AgentRelease:
      type: object
      properties:
        agent:
          type: string
          example: issue-investigator
        environment:
          type: string
          enum: [production, shadow]
        version:
          type: string
          example: 1.0.0
        status:
          type: string
          example: active
        traffic_weight:
          type: integer
          example: 100
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string

    AgentExecution:
      type: object
      description: >-
        One DevLoopWorkflow step's durable outcome (dev-workflow control
        plane, plan phase 4). Written by the Temporal worker after the
        underlying Argo workflow reaches a terminal phase, since Argo
        workflow objects expire after ttlStrategy.secondsAfterCompletion.
      properties:
        id:
          type: integer
        temporal_workflow_id:
          type: string
          example: dev-loop-mctlhq-mctl-telegram-296
        agent:
          type: string
          example: issue-investigator
        environment:
          type: string
          enum: [production, shadow]
        version:
          type: string
          description: Empty when this step ran before the agent had any registered release.
          example: 1.0.0
        image_ref:
          type: string
          example: ghcr.io/mctlhq/mctl-agents@sha256:abc123
        target_repo:
          type: string
          description: >-
            The sibling repo (e.g. mctl-telegram) this step's target-repo
            inputs came from. Not the exact git SHA yet — no Argo
            ClusterWorkflowTemplate exposes one as a workflow output today.
          example: mctl-telegram
        argo_workflow_name:
          type: string
          example: mctl-agents-investigate-ab12cd34
        phase:
          type: string
          enum: [Succeeded, Failed, Error]
        created_at:
          type: string
          format: date-time

    HumanInputRequest:
      type: object
      description: |
        Redacted view of a sealed HumanInputRequest. Execution hashes, the
        target commit, Argo names and question_hash are not exposed.
      properties:
        request_id:
          type: string
          example: hir-377a93a48528eb13
        request_hash:
          type: string
          description: Seal a response must echo back.
        request_version:
          type: integer
        round:
          type: integer
        work_item_id:
          type: string
        service:
          type: string
        proposal:
          type: string
        workflow_id:
          type: string
          example: dev-loop-mctlhq-mctl-api-261
        agent:
          type: string
        question:
          type: string
        reason:
          type: string
        response_type:
          type: string
          enum: [free_text, single_choice, multi_choice, structured]
        options:
          type: array
          items:
            type: string
        context_refs:
          type: array
          items:
            type: string
        audience:
          type: string
        eligible_actors:
          type: array
          items:
            type: string
          description: Full allow-list; present only for admins and the service principal.
        can_respond:
          type: boolean
          description: Whether the caller's own GitHub-verified `github:<login>` is eligible.
        created_at:
          type: string
        expires_at:
          type: string
        state:
          type: string
          enum: [pending, expired, timed_out, resolved, not_pending, unknown]
        state_detail:
          type: string

    HumanInputResponseResult:
      type: object
      properties:
        request_id:
          type: string
        status:
          type: string
          enum: [accepted, pending_delivery, rejected]
        state:
          type: string
          description: Request state when not accepted (superseded, expired, timed_out, not_pending, answered, invalid_value, not_eligible, ...).
        detail:
          type: string
        respondent:
          type: string
          example: github:alice
        received_at:
          type: string

    RoadmapWaveRequest:
      type: object
      additionalProperties: false
      required: [epic]
      properties:
        epic: {type: string, description: 'Epic name or root issue (owner/repo#N)'}
        required_only: {type: boolean, default: true}
        items:
          type: array
          items: {type: string}
          description: Exact work-item ids; omit (plan only) for every eligible item
    RoadmapWaveExecuteRequest:
      type: object
      additionalProperties: false
      required: [epic, items, plan_hash, state_revision]
      properties:
        epic: {type: string, description: 'Epic name or root issue (owner/repo#N)'}
        required_only: {type: boolean, default: true}
        items:
          type: array
          items: {type: string}
          description: The plan's exact selected ids
        plan_hash: {type: string}
        state_revision: {type: string}
    RoadmapWaveItem:
      type: object
      properties:
        id: {type: string}
        required: {type: boolean}
        issue:
          type: object
          properties:
            repository: {type: string}
            number: {type: integer}
        issue_url: {type: string}
        workflow_id: {type: string}
    RoadmapWavePlan:
      type: object
      properties:
        plan_hash: {type: string, description: 'sha256 over the epic, manifest path/sha256/revision, state and evaluator revisions, required_only and the selected items'}
        operation_id: {type: string}
        epic: {$ref: '#/components/schemas/RoadmapEpic'}
        required_only: {type: boolean}
        selected:
          type: array
          items: {$ref: '#/components/schemas/RoadmapWaveItem'}
        refused:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              reason: {type: string, enum: [unknown_item, not_ready, optional_not_requested, unbound, not_startable, duplicate_item]}
              state: {type: string}
        provenance: {$ref: '#/components/schemas/RoadmapProvenance'}
    RoadmapEpic:
      type: object
      properties:
        name: {type: string}
        lifecycle: {type: string, enum: [proposed, active, paused, completed, archived]}
        title: {type: string}
        goal: {type: string}
        issue:
          type: object
          properties:
            repository: {type: string}
            number: {type: integer}
        manifest:
          type: object
          properties:
            path: {type: string}
            sha256: {type: string}
    RoadmapProvenance:
      type: object
      properties:
        state_revision:
          type: string
          description: The roadmap-state commit this answer was read from.
        evaluator_revision: {type: string}
        source:
          type: object
          properties:
            repository: {type: string}
            ref: {type: string}
            revision: {type: string}
        observation:
          type: object
          properties:
            mode: {type: string, enum: [live-capture, synthetic-fixture]}
            capturedAt: {type: string, format: date-time}
            apiBase: {type: string}
        age_seconds:
          type: integer
          description: Seconds since observation.capturedAt; absent when the observation has no capture time.
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    WorkItemError:
      type: object
      description: Error with a typed code a client can branch on.
      properties:
        error: {type: string}
        code:
          type: string
          enum: [work_items_unavailable, work_item_not_found, invalid_request, actor_not_accepted,
                 state_version_conflict, invalid_transition, execution_active, idempotency_key_reused,
                 secret_in_text, tenant_forbidden, external_key_in_use]
        details:
          type: object
          description: For 409s on an item, its current `state` and `state_version`.
          properties:
            state: {type: string}
            state_version: {type: integer, format: int64}
      required: [error, code]

    WorkItem:
      type: object
      properties:
        id: {type: string, example: wi_5c8e0f3a-1b2c-4d5e-8f90-123456789abc}
        tenant: {type: string}
        owner_principal: {type: string, description: 'Derived from authentication, e.g. github:alice or service:mctl-agent.'}
        visibility: {type: string, enum: [tenant, private]}
        origin_surface: {type: string}
        title: {type: string, maxLength: 256}
        external_key: {type: string}
        state: {type: string, enum: [active, waiting, completed, superseded, archived]}
        waiting_reason: {type: string, enum: [input, approval]}
        superseded_by: {type: string}
        state_version: {type: integer, format: int64}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        schema_version: {type: string, enum: [workitem/v1]}
      required: [id, tenant, owner_principal, visibility, origin_surface, title, state, state_version, created_by, created_at, updated_at, schema_version]

    WorkItemExecution:
      type: object
      properties:
        id: {type: string, example: we_9a01c2d3-0000-4000-8000-000000000000}
        work_item_id: {type: string}
        engine: {type: string, enum: [temporal, argo]}
        engine_ref: {type: string}
        attempt: {type: integer}
        resumed_from_execution_id: {type: string}
        phase: {type: string, enum: [Pending, Running, Succeeded, Failed, Error]}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
      required: [id, work_item_id, engine, engine_ref, attempt, phase, started_at]

    WorkItemView:
      type: object
      properties:
        schema_version: {type: string, enum: [workitem/v1]}
        work_item: {$ref: '#/components/schemas/WorkItem'}
        state_version: {type: integer, format: int64}
        latest_execution:
          nullable: true
          allOf: [{$ref: '#/components/schemas/WorkItemExecution'}]
        latest_snapshot:
          nullable: true
          description: The latest sealed ContextSnapshot, by pointer; null when none is sealed.
          allOf: [{$ref: '#/components/schemas/ContextSnapshotRef'}]
      required: [schema_version, work_item, state_version, latest_execution, latest_snapshot]

    ContextSnapshotRef:
      type: object
      properties:
        id: {type: string, example: cs_1f2b3c4d5e6f708192a3b4c5d6e7f809}
        execution_id: {type: string}
        content_hash: {type: string, example: 'sha256:1f2b...'}
      required: [id, execution_id, content_hash]

    ContextSnapshot:
      type: object
      description: |
        One sealed, immutable snapshot of what an execution was given
        (mctl-agents#431). One per execution. `canonical_b64` is the exact
        canonical bytes, base64-encoded so no JSON re-encoding can change
        them; `content_hash` is `sha256:<hex>` of those bytes and is verified
        on every write and read. `id` is derived from the execution id and
        `content_hash`, so identical bytes of two executions are two snapshots.
      properties:
        id: {type: string, example: cs_1f2b3c4d5e6f708192a3b4c5d6e7f809}
        work_item_id: {type: string}
        execution_id: {type: string}
        execution_sequence: {type: integer, description: "The execution's attempt."}
        content_hash: {type: string}
        canonical_b64: {type: string, format: byte}
        strategy: {type: string}
        strategy_version: {type: string}
        prior_execution_id: {type: string}
        prior_snapshot_id: {type: string}
        produced_by: {type: string}
        created_at: {type: string, format: date-time}
        schema_version: {type: string, enum: [workitem/v1]}
      required: [id, work_item_id, execution_id, execution_sequence, content_hash, canonical_b64, strategy, strategy_version, produced_by, created_at, schema_version]

    ContextSnapshotSummary:
      type: object
      description: A ContextSnapshot without `canonical_b64`, as listed.
      properties:
        id: {type: string}
        work_item_id: {type: string}
        execution_id: {type: string}
        execution_sequence: {type: integer}
        content_hash: {type: string}
        strategy: {type: string}
        strategy_version: {type: string}
        prior_execution_id: {type: string}
        prior_snapshot_id: {type: string}
        produced_by: {type: string}
        created_at: {type: string, format: date-time}
        schema_version: {type: string, enum: [workitem/v1]}
      required: [id, work_item_id, execution_id, execution_sequence, content_hash, strategy, strategy_version, produced_by, created_at, schema_version]

    ActionApprovalRequest:
      type: object
      description: |
        A durable, single-use human approval of ONE hashed side effect of one
        runtime execution (mctl-api#366). Immutable once created apart from
        its state transitions: `pending` -> `approved` | `denied`, then
        `approved` -> `consumed`. `state` is the effective state: a pending or
        approved request past `expires_at` reads as `expired` (lazy expiry;
        `expired` is never stored), and a decision or consume on it is
        refused. `requested_by` and `decided_by` come from authentication,
        never from a body.
      properties:
        id: {type: string, example: aar_0f8c2d1e9b7a4c3d8e6f5a4b3c2d1e0f}
        execution_id: {type: string}
        action_kind: {type: string, description: The action or capability, e.g. github.merge_pr}
        target: {type: string}
        args_digest: {type: string}
        policy_rule_id: {type: string}
        policy_version: {type: string}
        artifact_hash: {type: string, description: Optional diff or payload hash}
        work_item_id: {type: string, description: Optional work item the action belongs to}
        idempotency_key: {type: string}
        requested_by: {type: string, example: 'service:mctl-agent'}
        intent_hash:
          type: string
          description: |
            `sha256:<hex>` over the canonical intent encoding, computed by the
            server: the line `mctl-action-intent/v1` then one line
            `<field>:<byte length>:<value>` per field, each ending in `\n`, in
            the order execution_id, action_kind, target, args_digest,
            policy_rule_id, policy_version, artifact_hash, work_item_id (an
            absent optional field is the empty string).
        state: {type: string, enum: [pending, approved, denied, consumed, expired]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        decided_by: {type: string}
        decided_at: {type: string, format: date-time}
        reason: {type: string}
        consumed_at: {type: string, format: date-time}
        schema_version: {type: string, enum: [actionapproval/v1]}
      required: [id, execution_id, action_kind, target, args_digest, policy_rule_id, policy_version, idempotency_key, requested_by, intent_hash, state, expires_at, created_at, schema_version]

    ActionApprovalResponse:
      type: object
      properties:
        schema_version: {type: string, enum: [actionapproval/v1]}
        approval: {$ref: '#/components/schemas/ActionApprovalRequest'}
      required: [schema_version, approval]

    ActionApprovalError:
      type: object
      description: Error with a typed code a client can branch on.
      properties:
        error: {type: string}
        code:
          type: string
          enum: [work_items_unavailable, invalid_request, actor_not_accepted, secret_in_text, intent_hash_mismatch,
                 approval_not_found, approval_idempotency_conflict, approval_already_decided,
                 approval_self_decision, approval_not_approved, approval_denied, approval_expired,
                 approval_intent_mismatch, approval_consumed, approval_requester_forbidden,
                 approval_decider_forbidden, approval_reader_forbidden]

    ExecutionRequest:
      type: object
      description: |
        A durable request that a work item run (mctl-api#368). SURFACE
        REQUESTS EXECUTION; SURFACE DOES NOT DECLARE EXECUTION IDENTITY: a
        person or a relaying surface creates it with the kind, the expected
        `state_version`, an optional intent and resumed-from reference, and
        an idempotency key. The execution platform (the service principal)
        claims it under a lease and fulfils it by attaching the canonical
        execution; only fulfilment sets `execution_id`. States: `pending` ->
        `claimed` -> `fulfilled` | `rejected`. A claim whose
        `claim_expires_at` has passed stays `claimed` and is claimable again;
        its lapsed holder can no longer fulfil or reject it. At most one
        `pending` or `claimed` request per work item.
      properties:
        id: {type: string, example: xr_0f8c2d1e9b7a4c3d8e6f5a4b3c2d1e0f}
        work_item_id: {type: string}
        kind: {type: string, enum: [start, resume]}
        expected_state_version: {type: integer, format: int64}
        resumed_from_execution_id: {type: string}
        intent_id: {type: integer, format: int64}
        surface: {type: string, description: 'Forced to the relaying surface on a relayed call.'}
        requested_by: {type: string, description: 'From authentication: the linked human on a relayed call, never a body field.', example: 'github:alice'}
        acting_principal: {type: string, description: 'The surface principal that relayed the request; absent when not relayed.', example: 'surface:telegram'}
        idempotency_key: {type: string}
        state: {type: string, enum: [pending, claimed, fulfilled, rejected]}
        claimed_by: {type: string, example: 'service:mctl-agent'}
        claimed_at: {type: string, format: date-time}
        claim_expires_at: {type: string, format: date-time}
        execution_id: {type: string, description: Set only by fulfilment, from the platform.}
        reason: {type: string, description: Why the platform rejected the request.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time}
        schema_version: {type: string, enum: [workitem/v1]}
      required: [id, work_item_id, kind, expected_state_version, surface, requested_by, state, created_at, updated_at, schema_version]

    ExecutionRequestResponse:
      type: object
      properties:
        schema_version: {type: string, enum: [workitem/v1]}
        execution_request: {$ref: '#/components/schemas/ExecutionRequest'}
      required: [schema_version, execution_request]

    ExecutionRequestError:
      type: object
      description: Error with a typed code a client can branch on.
      properties:
        error: {type: string}
        code:
          type: string
          enum: [work_items_unavailable, work_item_not_found, invalid_request, actor_not_accepted,
                 execution_identity_not_accepted, state_version_conflict, invalid_transition,
                 execution_active, idempotency_key_reused, secret_in_text, execution_not_found,
                 intent_not_found, execution_request_open, execution_request_not_found,
                 execution_request_not_claimed, execution_request_closed,
                 execution_request_requester_forbidden, execution_request_claimant_forbidden]
        details:
          type: object
          description: |
            For 409s on the item, its current `state` and `state_version`. For
            `execution_request_open`, the open request's
            `execution_request_id` and `state`, to follow instead. For
            `execution_request_closed`, the request's `execution_request_id`,
            `state` and, once fulfilled, `execution_id`.
          properties:
            state: {type: string}
            state_version: {type: integer, format: int64}
            execution_request_id: {type: string}
            execution_id: {type: string}
      required: [error, code]

    WorkItemEvent:
      type: object
      properties:
        work_item_id: {type: string}
        seq: {type: integer, format: int64}
        kind: {type: string, enum: [created, state_changed, resumed, intent_appended, execution_attached, surface_linked, snapshot_sealed,
                                     execution_requested, execution_request_claimed, execution_request_fulfilled, execution_request_rejected]}
        from_state: {type: string}
        to_state: {type: string}
        actor_principal: {type: string}
        acting_principal: {type: string, description: 'The surface principal (surface:<name>) that relayed the change for actor_principal; absent when not relayed'}
        surface: {type: string}
        request_id: {type: string}
        detail: {type: object}
        created_at: {type: string, format: date-time}

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns 200 if the server is running. No authentication required.
      security: []
      tags: [Health]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness check
      description: |
        Returns 200 when configured dependencies (gitops, postgres, Dex, Vault)
        pass their probes. Unconfigured dependencies are reported as
        `not_configured` and do not fail readiness. No authentication required.
      security: []
      tags: [Health]
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        '503':
          description: A configured dependency probe failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not ready
                  checks:
                    type: object
                    additionalProperties:
                      type: string

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Returns this OpenAPI 3.0 spec in YAML format. No authentication required.
      security: []
      tags: [Docs]
      responses:
        '200':
          description: OpenAPI YAML spec
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      summary: Swagger UI
      description: Redirects to Swagger UI pre-loaded with the mctl API spec. No authentication required.
      security: []
      tags: [Docs]
      responses:
        '302':
          description: Redirect to Swagger UI

  /api/v1/webhooks/github:
    post:
      summary: GitHub webhook receiver
      description: |
        Receives GitHub `pull_request` (opened, reopened, synchronize, ready_for_review, closed) and
        `pull_request_review` (submitted) deliveries and queues a reference-only
        `mctl.events/v1` envelope for Claude Remote (mctlhq/.github#87). No bearer
        token: the request is authenticated by `X-Hub-Signature-256`, an HMAC-SHA256
        of the raw body with `GITHUB_WEBHOOK_SECRET`. The body is capped at 1 MiB.
        A redelivery with the same `X-GitHub-Delivery` is accepted but not queued again.
      security: []
      tags: [Webhooks]
      parameters:
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string, example: 'sha256=<hex>'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The GitHub webhook payload; only reference fields are read.
      responses:
        '200':
          description: '`ping` event acknowledged with `{"status": "pong"}`'
        '202':
          description: Delivery accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued, duplicate, ignored]
                  event_id:
                    type: string
                    description: Envelope id, `github:<delivery id>`; present when queued or duplicate
                  reason:
                    type: string
                    description: Why an ignored delivery was not queued
        '400':
          description: Malformed payload or delivery id
        '401':
          description: Missing or invalid signature, or no secret configured
        '413':
          description: Body larger than 1 MiB
        '503':
          description: Event outbox unavailable; GitHub keeps the delivery marked failed

  /api/v1/tenants:
    get:
      summary: List all team workspaces
      description: Returns all tenant workspaces with their quotas and members. **Admin access required.**
      tags: [Tenants]
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                  count:
                    type: integer
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/tenants/{name}:
    get:
      summary: Get a team workspace
      description: Returns details of a specific tenant including members, quotas, and deployed services.
      tags: [Tenants]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: billing
      responses:
        '200':
          description: Tenant details with services
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant:
                    $ref: '#/components/schemas/Tenant'
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/services:
    get:
      summary: List deployed services
      description: Returns all deployed services. Optionally filter by team.
      tags: [Services]
      parameters:
        - name: team
          in: query
          required: false
          schema:
            type: string
          description: Filter by team name
          example: billing
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  count:
                    type: integer

  /api/v1/services/{team}/{app}:
    get:
      summary: Get service configuration
      description: |
        Returns the full GitOps configuration for a service: image tag, host, port,
        component type, and database status. Use this when you need full details
        beyond what list_services provides — especially to find the current image tag
        before a rollback.
      tags: [Services]
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
          example: billing
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: payment-api
      responses:
        '200':
          description: Service configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/status/{team}/{app}:
    get:
      summary: Get service live status
      description: |
        Returns the live ArgoCD sync and health status for a service.
        Includes sync state (Synced/OutOfSync), health (Healthy/Degraded/Progressing),
        and the current service configuration from GitOps.
      tags: [Services]
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
          example: billing
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: payment-api
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  argocd:
                    $ref: '#/components/schemas/ArgoStatus'
                  service:
                    $ref: '#/components/schemas/Service'
        '404':
          description: ArgoCD application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/logs/{team}/{app}:
    get:
      summary: Get service logs
      description: |
        Fetches recent log lines for a service from Loki.
        Requires in-cluster deployment with Loki accessible at `LOKI_URL`.

        Returns log lines sorted by timestamp (most recent first).
      tags: [Services]
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
          example: billing
        - name: app
          in: path
          required: true
          schema:
            type: string
          example: payment-api
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Number of log lines to return (max 1000)
        - name: since
          in: query
          required: false
          schema:
            type: string
            default: 1h
          description: Time window for log retrieval (e.g. 15m, 1h, 6h, 24h)
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    type: string
                  app:
                    type: string
                  lines:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogLine'
                  count:
                    type: integer
                  note:
                    type: string
        '404':
          description: Service or tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/workflows/{name}:
    get:
      summary: Get workflow status
      description: |
        Returns the status and audit log entry for an Argo Workflow.
        Use this after triggering an operation to track progress.

        Cron-driven runs (e.g. mctl-agents-issue-poll, -implement, -run,
        -shepherd) are spawned directly by Argo's CronWorkflow controller and
        never enter the audit log, since only operator-initiated REST
        submissions do. For admins, a workflow absent from the audit log
        falls back to a live Kubernetes lookup in the argo-workflows
        namespace instead of 404ing outright; non-admins still get a 404,
        since there is no audit entry to check team ownership against.
      tags: [Workflows]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: deploy-service-abc12
      responses:
        '200':
          description: Workflow status and audit entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatus'

  /api/v1/workflows/{name}/logs:
    get:
      summary: Get workflow step logs
      description: |
        Returns Argo Workflow step logs from the archive Argo uploads them to.

        This is a different source from `/api/v1/logs/{team}/{app}`, which
        queries Loki: Loki only ingests long-lived service pods matching the
        tenant naming convention, so it cannot serve Argo step pods.

        Without `step`, lists the archived steps. That listing is itself
        diagnostic — a step missing from an otherwise-populated workflow never
        produced output, the signature of a pod that never started rather than
        one that ran and failed.

        Access is scoped to the workflow's owning team as recorded in the audit
        log. Workflows with no owning team — every cron-driven run, plus
        platform-scoped operations — require admin group membership.

        Requires the archive to be configured (`ARGO_LOGS_R2_*`); otherwise the
        response carries an explanatory `note`.
      tags: [Workflows]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: mctl-agents-issue-poll-1785399300
        - name: step
          in: query
          required: false
          schema:
            type: string
          description: Step name substring to read logs for. Omit to list archived steps.
          example: run-poller
        - name: lines
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Trailing log lines per step (max 1000)
      responses:
        '200':
          description: Archived step listing, or step log bodies when `step` is given
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow:
                    type: string
                  count:
                    type: integer
                  steps:
                    type: array
                    description: Present when `step` is omitted.
                    items:
                      type: object
                      properties:
                        step:
                          type: string
                        pod:
                          type: string
                        key:
                          type: string
                        size:
                          type: integer
                        lastModified:
                          type: string
                          format: date-time
                  logs:
                    type: array
                    description: Present when `step` is given.
                    items:
                      type: object
                      properties:
                        step:
                          type: string
                        pod:
                          type: string
                        size:
                          type: integer
                        lines:
                          type: string
                        error:
                          type: string
                  note:
                    type: string
        '403':
          description: Workflow belongs to another team, or has no owning team and the caller is not an admin

  /api/v1/resources/{tenant}:
    get:
      summary: Get resource quota usage
      description: |
        Returns CPU, memory, and pod quota allocation and live usage for a team namespace.
        Live usage requires in-cluster deployment; otherwise returns empty `used` map.
      tags: [Resources]
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
          example: billing
      responses:
        '200':
          description: Resource quota usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUsage'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/audit:
    get:
      summary: List recent platform operations
      description: |
        Returns the most recent 50 audit log entries — who ran what operation,
        when, and which workflow was triggered.
      tags: [Audit]
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  count:
                    type: integer

  /api/v1/repos:
    get:
      summary: List available GitHub repositories
      description: |
        Lists GitHub repositories available to a team for deployment.
        Shows repos from GitHub App installations registered for the team.
      tags: [Repos]
      parameters:
        - name: team
          in: query
          required: true
          schema:
            type: string
          example: billing
      responses:
        '200':
          description: Available repositories
          content:
            application/json:
              schema:
                type: object

  /api/v1/repos/sync:
    post:
      summary: Discover and register GitHub repositories
      description: |
        Scans GitHub App installations accessible to the authenticated user
        and registers found repos for the team.
      tags: [Repos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team:
                  type: string
                user:
                  type: string
                  deprecated: true
                  description: >-
                    Ignored server-side. The authenticated caller's identity
                    is always used.
      responses:
        '200':
          description: Sync result

  /api/v1/operations:
    get:
      summary: List available operations
      description: Returns all registered platform operations with their parameter definitions.
      tags: [Operations]
      responses:
        '200':
          description: Operations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Operation'
                  count:
                    type: integer

  /api/v1/operations/{name}:
    get:
      summary: Get operation definition
      description: Returns the parameter definitions and metadata for a specific operation.
      tags: [Operations]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: deploy-service
      responses:
        '200':
          description: Operation definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/operations/{name}/execute:
    post:
      summary: Execute a platform operation
      description: |
        Submits an Argo Workflow to execute the named operation.
        Returns a `workflowName` that can be polled via `GET /api/v1/workflows/{name}`.

        **Available operations:**

        | Name | Description | Risk |
        |------|-------------|------|
        | `deploy-service` | Build image and deploy / update service | medium |
        | `create-tenant` | Create new team workspace | medium |
        | `provision-database` | Provision PostgreSQL database | medium |
        | `retire-service` | Permanently remove a service | high |
        | `delete-tenant` | Delete team workspace | high |
        | `rollback-service` | Roll back to a previous image tag | medium |
        | `preview-deploy` | Deploy ephemeral preview environment | low |
        | `preview-delete` | Remove preview environment | low |

        **Rate limit:** 20 requests/minute per user.
      tags: [Operations]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: deploy-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
            examples:
              deploy:
                summary: Deploy a service
                value:
                  team_name: billing
                  component_name: payment-api
                  action: deploy
                  git_tag: "1.2.3"
                  dockerfile_repo: mctlhq/payment-api
              update-config:
                summary: Update environment variables
                value:
                  team_name: billing
                  component_name: payment-api
                  action: update-config
                  env_vars: "LOG_LEVEL=debug\nTIMEOUT=30"
              rollback:
                summary: Roll back to previous tag
                value:
                  team_name: billing
                  component_name: payment-api
                  target_tag: "1.1.0"
              preview:
                summary: Create preview environment
                value:
                  team_name: billing
                  component_name: payment-api
                  image_tag: "1.2.3"
                  ttl_hours: "4"
      responses:
        '200':
          description: Workflow submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied to this team's resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/platform-skills:
    get:
      summary: List platform-wide skills
      description: |
        Returns the platform skill catalog, filtered to what the caller can see.
        `platform-internal` skills are never returned. `draft` skills are admin-only.
        `tenant`-visibility skills are only included if enabled for one of the
        caller's tenants or role bindings.
      tags: [Platform Skills]
      responses:
        '200':
          description: List of platform skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformSkill'
                  count:
                    type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Publish or update a platform skill
      description: |
        Submits the `platform-skill-publish` workflow to write a catalog entry
        (`metadata.yaml` + `SKILL.md`) to `mctl-gitops`. **Admin access required.**
        Content is scanned for obvious secret patterns and rejected if any are found.
      tags: [Platform Skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, title, description, owner, content]
              properties:
                name:
                  type: string
                  example: mctl-platform
                title:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, tenant, admin, platform-internal]
                  default: tenant
                status:
                  type: string
                  enum: [draft, active, deprecated]
                  default: active
                owner:
                  type: string
                runtimes:
                  type: array
                  items:
                    type: string
                content:
                  type: string
                  description: Raw SKILL.md content
      responses:
        '202':
          description: Publish workflow submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSkillWorkflowResponse'
        '400':
          description: Invalid metadata, empty content, or a detected secret pattern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/platform-skills/{name}:
    get:
      summary: Read a platform skill
      description: |
        Returns metadata and raw `SKILL.md` content for a single skill, if the
        caller can access it (per the same visibility rules as the list endpoint).
      tags: [Platform Skills]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: mctl-platform
      responses:
        '200':
          description: Skill metadata and content
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    $ref: '#/components/schemas/PlatformSkillMetadata'
                  content:
                    type: string
        '403':
          description: Access denied to this skill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Platform skill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/platform-skills/{name}/deprecate:
    post:
      summary: Deprecate a platform skill
      description: |
        Submits the `platform-skill-deprecate` workflow to mark a catalog
        entry's `status` as `deprecated`. **Admin access required.**
        Deprecated skills remain readable for tenants that already have them
        enabled, but cannot be newly enabled for other tenants.
      tags: [Platform Skills]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: mctl-platform
      responses:
        '202':
          description: Deprecate workflow submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSkillWorkflowResponse'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/platform-skills/bindings/tenants:
    get:
      summary: List tenant skill bindings
      description: |
        Returns tenant skill bindings. Admins see all tenants; non-admins see
        only bindings for tenants they belong to.
      tags: [Platform Skills]
      responses:
        '200':
          description: List of tenant bindings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformSkillBinding'
                  count:
                    type: integer

  /api/v1/platform-skills/bindings/tenants/enable:
    post:
      summary: Enable a platform skill for a tenant
      description: |
        Submits the `platform-skill-enable` workflow to add a skill to a
        tenant's `enabledSkills` binding. **Admin access required.**
        Rejected if the skill is not `active`, does not have `tenant`
        visibility, or is denied for the tenant by `policy.yaml`.
      tags: [Platform Skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, skill]
              properties:
                tenant:
                  type: string
                  example: nfc
                skill:
                  type: string
                  example: mctl-platform
      responses:
        '202':
          description: Enable workflow submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSkillWorkflowResponse'
        '400':
          description: Invalid tenant/skill name, or the skill is not eligible for tenant binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Platform skill not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/platform-skills/bindings/tenants/disable:
    post:
      summary: Disable a platform skill for a tenant
      description: |
        Submits the `platform-skill-disable` workflow to remove a skill from
        a tenant's `enabledSkills` binding. **Admin access required.**
      tags: [Platform Skills]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, skill]
              properties:
                tenant:
                  type: string
                  example: nfc
                skill:
                  type: string
                  example: mctl-platform
      responses:
        '202':
          description: Disable workflow submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSkillWorkflowResponse'
        '400':
          description: Invalid tenant/skill name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents:
    post:
      summary: Create or update an agent definition
      description: |
        Idempotent by design — republishing the same name updates
        description/owner in place (blank fields leave the existing value
        untouched, so a caller that only knows the name can't wipe it out).
        **Admin access required.**
      tags: [Agent Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: issue-investigator
                description:
                  type: string
                owner:
                  type: string
                  example: mctl-agents
      responses:
        '201':
          description: Agent definition created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinition'
        '400':
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/{name}/versions:
    get:
      summary: List published versions of an agent
      description: |
        Every published version of one agent, newest first. Versions are
        immutable — this never returns fewer or different rows for a given
        (agent, version) pair once published. **Admin access required.**
      tags: [Agent Registry]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: issue-investigator
      responses:
        '200':
          description: List of agent versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentVersion'
                  count:
                    type: integer
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Publish an immutable agent version
      description: |
        Intended caller: CI, after `orchestrator/validate_manifest.py` has
        passed. `(agent, version)` is a once-only key — republishing the same
        version is rejected, never overwritten. **Admin access required.**
      tags: [Agent Registry]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: issue-investigator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, manifest_json, git_sha, image_repository, prompt_hash]
              properties:
                version:
                  type: string
                  example: 1.0.0
                manifest_json:
                  type: string
                  description: The published AgentManifest (agent.yaml), as JSON
                git_sha:
                  type: string
                image_repository:
                  type: string
                  example: ghcr.io/mctlhq/mctl-agents
                image_digest:
                  type: string
                prompt_hash:
                  type: string
      responses:
        '201':
          description: Version published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentVersion'
        '400':
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent has no definition yet — POST /api/v1/agents first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/{name}/releases:
    post:
      summary: Promote or roll back an agent's release in an environment
      description: |
        Set `version` to promote to an explicit published version, or set
        `rollback: true` (with no `version`) to revert to whatever the
        environment had immediately before its current release — derived
        from the promotion audit trail, not a separate pointer. The two are
        mutually exclusive: setting both is rejected. Takes effect for the
        next resolve; in-flight workflows keep whatever version they already
        pinned. **Admin access required.**
      tags: [Agent Registry]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: issue-investigator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment:
                  type: string
                  enum: [production, shadow]
                version:
                  type: string
                  example: 1.0.0
                  description: Required unless rollback is true; must not be set together with rollback
                rollback:
                  type: boolean
                  default: false
                reason:
                  type: string
      responses:
        '200':
          description: Release updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRelease'
        '400':
          description: Missing/contradictory fields, or an invalid environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: version does not exist among the agent's published versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No prior version to roll back to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/{name}/resolve:
    get:
      summary: Resolve the version currently released to an environment
      description: |
        The read path a Temporal DevLoopWorkflow activity calls once per
        agent step to pin an immutable version for the rest of that
        workflow run. **Admin access required.**
      tags: [Agent Registry]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: issue-investigator
        - name: environment
          in: query
          required: true
          schema:
            type: string
            enum: [production, shadow]
      responses:
        '200':
          description: Currently released version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRelease'
        '400':
          description: Missing or invalid environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No release for this agent/environment pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/executions:
    post:
      summary: Record one DevLoopWorkflow step's durable outcome
      description: |
        Written by orchestrator/temporal/activities/state.py after the
        underlying Argo workflow reaches a terminal phase (phase 4). Not
        gated on the agent already having a definition/release — a step
        that ran before its first promotion still gets recorded, with
        version/image_ref empty. **Admin access required.**
      tags: [Agent Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temporal_workflow_id, agent, environment, phase]
              properties:
                temporal_workflow_id:
                  type: string
                agent:
                  type: string
                environment:
                  type: string
                  enum: [production, shadow]
                version:
                  type: string
                image_ref:
                  type: string
                target_repo:
                  type: string
                argo_workflow_name:
                  type: string
                phase:
                  type: string
                  enum: [Succeeded, Failed, Error]
      responses:
        '201':
          description: Execution record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecution'
        '400':
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List execution records, newest first
      description: |
        Unlike the live Argo view behind mctl_list_recent_agent_runs, these
        records persist independent of Argo's ttlStrategy. **Admin access
        required.**
      tags: [Agent Registry]
      parameters:
        - name: agent
          in: query
          required: false
          schema:
            type: string
          example: issue-investigator
        - name: workflow_id
          in: query
          required: false
          description: Filter to one Temporal workflow (all its recorded steps). Combines with agent (AND) when both are set.
          schema:
            type: string
          example: dev-loop-mctlhq-mctl-telegram-296
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Execution records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentExecution'
                  count:
                    type: integer
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/dev-loop/start:
    post:
      summary: Start a durable DevLoopWorkflow for one GitHub issue
      description: |
        The use_temporal path for mctl_trigger_issue (plan phase 4): starts
        DevLoopWorkflow on the shared Temporal deployment instead of
        submitting the investigate ClusterWorkflowTemplate directly. The
        workflow itself pins a registry-resolved agent version and submits
        that same CWFT as its first activity, then durably waits for a
        signalled approval before running the implementer. Requires the
        server's Temporal client to be configured. **Admin access required.**
      tags: [Agent Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issue_url]
              properties:
                issue_url:
                  type: string
                  example: https://github.com/mctlhq/mctl-telegram/issues/296
      responses:
        '202':
          description: Workflow started
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:
                    type: string
                    example: dev-loop-mctlhq-mctl-telegram-296
                  run_id:
                    type: string
                  message:
                    type: string
        '400':
          description: Missing issue_url, or issue_url is not a well-formed mctlhq GitHub issue URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Temporal client not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/cloudflare/portal/server-auth/apply:
    post:
      summary: Dispatch the Cloudflare MCP portal server-auth apply workflow
      description: |
        Starts `cloudflare-apply.yml` on `main` in `mctlhq/mctl-gitops` for the
        pinned root `infrastructure/cloudflare/portal`,
        which applies the committed OAuth registration — endpoints, client, and
        above all the scope the portal requests — of the Cloudflare MCP portal's
        upstream servers.

        This endpoint writes nothing to Cloudflare and holds no Cloudflare
        credential. The write token is an environment secret on that
        repository's `cloudflare-apply` environment, issued only to a job that
        requests the environment and only after a required reviewer approves
        it. So a call here starts a run whose plan job publishes the
        live-vs-committed comparison and whose apply job then waits for a
        human. The response carries a link to the workflow's run list rather
        than a run id: the dispatch API answers 204 with no body, because at
        that moment the run does not exist yet.

        Takes no parameters. What is applied is the file at HEAD of `main`;
        changing it is a pull request against that file, not a call here.
        **Admin access required.**
      tags: [Operations]
      responses:
        '202':
          description: Workflow dispatched (nothing applied yet — the apply job still needs environment approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  repo:
                    type: string
                    example: mctlhq/mctl-gitops
                  workflow:
                    type: string
                    example: cloudflare-apply.yml
                  ref:
                    type: string
                    example: main
                  runs_url:
                    type: string
                    example: https://github.com/mctlhq/mctl-gitops/actions/workflows/cloudflare-apply.yml
                  message:
                    type: string
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: GitHub refused the dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: GitHub workflow dispatch not configured (GITOPS_ACTIONS_TOKEN unset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/dev-loop/{workflow_id}:
    get:
      summary: Describe a DevLoopWorkflow's execution status
      description: |
        Liveness read for one issue's DevLoopWorkflow — used by the shepherd
        sweeper to skip proposals a live DevLoop already drives.
        **Admin access required.**
      tags: [Agent Registry]
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
          example: dev-loop-mctlhq-mctl-telegram-296
      responses:
        '200':
          description: Workflow execution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:
                    type: string
                  status:
                    type: string
                    description: Temporal execution status short name
                    example: Running
                  shepherd_in_loop:
                    type: boolean
                    description: |
                      Whether this execution runs its own in-loop shepherd
                      ticks. False for a Running workflow that started before
                      mctl-agents shipped the `shepherd-in-loop` patch, and
                      whenever the query cannot be answered — in both cases
                      the shepherd cron stays responsible for the proposal.
                    example: true
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No workflow with this ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Temporal client not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents/dev-loop/{workflow_id}/approve:
    post:
      summary: Signal a running DevLoopWorkflow's approval
      description: |
        The durable "human flips it to accepted" step, expressed as a
        Temporal signal instead of a gitops .status.yaml edit. Unblocks the
        workflow's wait_condition so it proceeds to the implement step.
        The optional body carries approval provenance; `approver` defaults
        to the authenticated caller and is recorded in the proposal's
        gitops approval block. **Admin access required.**
      tags: [Agent Registry]
      parameters:
        - name: workflow_id
          in: path
          required: true
          schema:
            type: string
          example: dev-loop-mctlhq-mctl-telegram-296
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approver:
                  type: string
                  description: Identity recorded as approved_by. Defaults to the authenticated caller.
                  example: mashkovd
                reason:
                  type: string
                  description: Optional free-form approval note.
      responses:
        '200':
          description: Signal delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_id:
                    type: string
                  signalled:
                    type: string
                    example: approve
        '400':
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Temporal client not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/surface-identities/challenges:
    post:
      summary: Request a one-time link challenge for a surface
      description: |
        mctl-api#350. Only a human authenticated by GitHub. Returns a one-time
        code, valid for 10 minutes, bound to the caller and the surface. The
        human sends it through that surface (e.g. to the Telegram bot), whose
        own principal redeems it. The body never names who is linked.
      tags: [Surface Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [surface]
              properties:
                surface: {type: string, enum: [telegram, portal]}
      responses:
        '201': {description: 'Challenge created; the code is shown once'}
        '400': {description: Invalid body or an identity field in it}
        '403': {description: Not a GitHub-authenticated human}
        '429': {description: Too many open challenges}
        '503': {description: Surface identity store not configured}
  /api/v1/surface-identities/redeem:
    post:
      summary: Redeem a challenge as the surface that observed it
      description: |
        Only the surface principal of the challenge's own surface
        (`surface:telegram`, `surface:portal`). Binds the identity the
        surface observed, named in `X-MCTL-Surface-Actor` (a Telegram user
        id, digits; or a portal subject), to the human who requested the
        challenge. A refused redemption by the surface consumes the
        challenge and answers the same 403. Rate limits count against the
        named identity, not the whole surface.
      tags: [Surface Identity]
      parameters:
        - name: X-MCTL-Surface-Actor
          in: header
          required: true
          schema: {type: string, maxLength: 256}
          description: The surface-native identity being linked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string}
      responses:
        '201': {description: Link created (or the same link again)}
        '400': {description: Invalid body or X-MCTL-Surface-Actor}
        '403': {description: Not a surface principal, or challenge unknown, used, expired or for another surface}
        '409': {description: The identity is linked to another principal}
  /api/v1/surface-identities:
    get:
      summary: List the caller's surface identity links
      description: A human admin may pass `principal=github:<login>`.
      tags: [Surface Identity]
      parameters:
        - {name: principal, in: query, required: false, schema: {type: string}}
      responses:
        '200': {description: Links, live and revoked}
        '403': {description: Not a GitHub-authenticated human, or not an admin for another principal}
  /api/v1/surface-identities/{id}/revoke:
    post:
      summary: Revoke a surface identity link
      description: The linked human or a human admin. Relayed requests for it fail from then on.
      tags: [Surface Identity]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Revoked (or already revoked)}
        '403': {description: Not a GitHub-authenticated human}
        '404': {description: No such link visible to the caller}
  /api/v1/roadmap/epics:
    get:
      summary: List the epics in the roadmap publication
      description: |
        Read-only view of the RoadmapPublication mctlhq/.github publishes to
        its generated `roadmap-state` branch (mctlhq/.github#119). mctl-api
        verifies the publication's digests and serves it; it never evaluates
        readiness. 503 means no publication could be verified: "cannot say",
        never "nothing is ready".
      tags: [Roadmap]
      responses:
        '200':
          description: Every published epic with its lifecycle, and the publication's provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  epics:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoadmapEpic'
                  provenance:
                    $ref: '#/components/schemas/RoadmapProvenance'
        '503':
          description: No verified roadmap publication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/roadmap/epic-status:
    get:
      summary: Status of one roadmap epic
      description: |
        The published RoadmapReadySet and RoadmapHealth for one epic, byte for
        byte, with the epic's lifecycle, title, goal and manifest digest.
      tags: [Roadmap]
      parameters:
        - name: epic
          in: query
          required: true
          schema: {type: string}
          description: 'Epic name, or its root issue as `owner/repo#N` (URL-encode the `#`).'
      responses:
        '200':
          description: Epic status
          content:
            application/json:
              schema:
                type: object
                properties:
                  epic:
                    $ref: '#/components/schemas/RoadmapEpic'
                  readiness:
                    type: object
                    description: The published RoadmapReadySet document for this epic.
                  health:
                    type: object
                    description: The published RoadmapHealth document for this epic.
                  provenance:
                    $ref: '#/components/schemas/RoadmapProvenance'
        '400':
          description: Missing epic
        '404':
          description: No epic by that name or root issue in the publication
        '503':
          description: No verified roadmap publication
  /api/v1/roadmap/ready:
    get:
      summary: Roadmap work items ready now
      description: |
        Ready-set items the publication lists as ready, verbatim, grouped by
        epic. Without `epic`, every epic whose lifecycle is `active`.
        Choosing among several ready items is a priority decision this
        endpoint does not make.
      tags: [Roadmap]
      parameters:
        - name: epic
          in: query
          required: false
          schema: {type: string}
          description: Epic name or root issue; omit for every active epic.
        - name: required_only
          in: query
          required: false
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Ready work items
          content:
            application/json:
              schema:
                type: object
                properties:
                  required_only: {type: boolean}
                  epics:
                    type: array
                    items:
                      type: object
                      properties:
                        epic:
                          $ref: '#/components/schemas/RoadmapEpic'
                        source:
                          type: object
                          description: The epic's observation block from the ready set.
                        items:
                          type: array
                          items:
                            type: object
                            description: A published ready-set item.
                  provenance:
                    $ref: '#/components/schemas/RoadmapProvenance'
        '400':
          description: Invalid required_only
        '404':
          description: No epic by that name or root issue in the publication
        '503':
          description: No verified roadmap publication
  /api/v1/roadmap/waves/plan:
    post:
      summary: Plan a roadmap epic wave (dry run)
      description: |
        The exact ready, bound work items of one epic that a wave would start
        (mctl-api#334), selected from the verified RoadmapPublication. Starts
        nothing. Only items the published ready set lists as ready are
        eligible; `required_only` defaults to true. With `items`, exactly
        those ids are planned or the answer is 409 `invalid_selection` naming
        each refused id — never a subset. Ready items that cannot be started
        (unbound, or not startable as a DevLoop) are listed in `refused`.
        `executable` says whether the plan can execute now: the publication's
        observation must be no older than `max_age_seconds`
        (ROADMAP_WAVE_MAX_AGE, default 30 minutes).
      tags: [Roadmap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapWaveRequest'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: {$ref: '#/components/schemas/RoadmapWavePlan'}
                  max_age_seconds: {type: integer}
                  executable: {type: boolean}
                  not_executable_reason: {type: string}
        '400': {description: Invalid body}
        '401': {description: Not authenticated}
        '404': {description: No such epic in the publication}
        '409': {description: '`invalid_selection`: an explicit item is unknown, not ready, optional without `required_only=false`, unbound, not startable or repeated; `epic_paused` / `epic_completed` / `epic_not_active`: only an active epic can plan a wave, with no override'}
        '503': {description: No verified publication (readiness unknown, not empty)}
  /api/v1/roadmap/waves/execute:
    post:
      summary: Start a planned roadmap epic wave
      description: |
        Starts one DevLoopWorkflow per selected item of a plan from
        `/api/v1/roadmap/waves/plan` (mctl-api#334). Admin-only. The body names
        the plan: its epic, `required_only`, exact selected `items`,
        `plan_hash` and `state_revision`. mctl-api reloads the latest verified
        publication and fails closed, starting nothing, unless its
        `state_revision` is the plan's (409 `plan_stale`), its observation is
        no older than ROADMAP_WAVE_MAX_AGE (409 `publication_too_old`), and
        the request re-derives the identical plan (409 `invalid_selection`).
        mctl-api never evaluates readiness, reads GitHub or dispatches the
        publisher here. Each item reports `started`, `already_running`,
        `already_exists` (a closed DevLoop is not restarted) or `failed`;
        repeating the request starts nothing twice. It never approves a
        proposal. Audited as `roadmap-wave-execute`.
      tags: [Roadmap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadmapWaveExecuteRequest'
      responses:
        '200':
          description: Per-item outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  operation_id: {type: string}
                  plan_hash: {type: string}
                  epic: {$ref: '#/components/schemas/RoadmapEpic'}
                  provenance: {$ref: '#/components/schemas/RoadmapProvenance'}
                  outcomes:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/RoadmapWaveItem'
                        - type: object
                          properties:
                            outcome: {type: string, enum: [started, already_running, already_exists, failed]}
                            status: {type: string}
                            run_id: {type: string}
                            error: {type: string}
        '400': {description: Invalid body, or no plan named}
        '401': {description: Not authenticated}
        '403': {description: Not an admin}
        '409': {description: '`plan_stale`, `publication_too_old`, `invalid_selection`, or `epic_paused` / `epic_completed` / `epic_not_active` (no override); nothing was started'}
        '503': {description: 'No verified publication, `wave_execution_disabled` (invalid ROADMAP_WAVE_MAX_AGE), or no Temporal client'}
  /api/v1/human-input:
    get:
      summary: List human-input requests the caller may answer
      description: |
        Read model for DevLoop human-input requests (mctl-agents ADR 013).
        Request content comes from mctl-gitops and is verified against its
        `request_hash` seal; a document that fails verification is never
        listed. Whether a request is still pending comes only from the owning
        DevLoopWorkflow's `human_input_state` query. Past `expires_at` a
        request is never pending; its reported state is still the workflow's
        (`resolved`, `timed_out`, ...) and falls back to `expired` only when
        the workflow cannot be asked.

        A caller sees a request only if their `github:<login>` is in its
        eligible actors, or they are an admin, or they are the service
        principal relaying for a surface. The login must be proven by
        authentication (a GitHub token, or an mctl-api OAuth token minted
        after GitHub login); a Dex username is never treated as a GitHub
        login. Other callers do not learn the request exists.

        Each owning workflow execution is queried once per call, within one
        overall time budget; expired requests are not queried.
      tags: [Agent Registry]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, all]
            default: pending
          description: |
            `pending` lists only requests the owning workflow is waiting on and
            that have not expired; `all` lists every visible request with its
            derived state.
        - name: work_item_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Visible requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HumanInputRequest'
                  count:
                    type: integer
                  invalid_documents:
                    type: integer
                    description: |
                      Admins and the service principal only: request documents
                      skipped because they failed verification (malformed or
                      altered after sealing). The workflow never waits on such
                      a document either.
        '400':
          description: Invalid state filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The gitops requests could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            gitops reader not configured, or `state=pending` was requested
            and pending could not be determined for at least one candidate
            (no Temporal client, a query failed or timed out). A short list
            is never returned in that case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/human-input/{request_id}:
    get:
      summary: Read one human-input request
      description: |
        Same visibility and verification rules as the list. A request the
        caller may not see is reported as 404, not 403.
      tags: [Agent Registry]
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^hir-[0-9a-f]{16}$'
          example: hir-377a93a48528eb13
      responses:
        '200':
          description: The request and its derived state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanInputRequest'
        '400':
          description: Malformed request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such request, or not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The gitops requests could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: gitops reader not configured (retryable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/human-input/{request_id}/response:
    post:
      summary: Answer a human-input request
      description: |
        Delivers one HumanInputResponse to the DevLoopWorkflow execution that
        sealed the request, as the `human_input_response` signal.

        - The respondent is always derived from authentication as
          `github:<login>`, and only when authentication proved the GitHub
          login. The body cannot name a respondent (unknown fields are
          rejected), and the service principal cannot answer.
        - Eligibility, `request_hash`, expiry and the typed value are
          checked here and again by the workflow, which has the final word.
        - Idempotent: resubmitting the same answer returns the same outcome.
          The first recorded answer wins; a different answer afterwards gets
          409 `answered`.
        - Recoverable: the answer is recorded before it is signalled. If
          Temporal is unavailable the call answers 503 `pending_delivery`,
          and any later submission for the request (the same one retried, or
          a competing one) first delivers the recorded answer.
        - An answer is information, not approval: this never signals
          `approve`.
      tags: [Agent Registry]
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^hir-[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_hash, value]
              properties:
                request_hash:
                  type: string
                  description: The `request_hash` of the request being answered.
                value:
                  description: |
                    The answer. A string for `free_text` (non-blank) and
                    `single_choice` (one of the options), a non-empty array of
                    options for `multi_choice`, an object for `structured`.
                surface:
                  type: string
                  pattern: '^[a-z][a-z0-9_-]{0,31}$'
                  default: api
                  description: Where the answer was typed (provenance only, not trusted).
      responses:
        '200':
          description: Accepted by the workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanInputResponseResult'
        '202':
          description: 'Signalled, not yet confirmed by the workflow (`status: pending_delivery`, `state: pending`); resubmit the same answer to check again'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanInputResponseResult'
        '400':
          description: Malformed body or request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Caller may read but not answer. `HumanInputResponseResult` with
            state `not_eligible` for an ineligible or non-GitHub-verified
            caller; `Error` for the service principal.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HumanInputResponseResult'
                  - $ref: '#/components/schemas/Error'
        '404':
          description: No such request, or not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Not accepted in the request's current state: `superseded` (hash
            mismatch), `expired`, `timed_out`, `not_pending`, `answered`
            (another answer won), or refused by the workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanInputResponseResult'
        '422':
          description: The value does not match the request's response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanInputResponseResult'
        '500':
          description: |
            `Error` when the gitops requests could not be read;
            `HumanInputResponseResult` (`status: rejected`) when a recorded
            answer is unreadable and has been dropped.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HumanInputResponseResult'
                  - $ref: '#/components/schemas/Error'
        '503':
          description: |
            `HumanInputResponseResult` with `status: pending_delivery` when the
            answer IS recorded but could not be signalled; it is delivered on
            the next submission for this request. `Error` (nothing recorded;
            retry) when the endpoint is not configured, the ledger is
            unavailable, or the workflow could not be asked before recording.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HumanInputResponseResult'
                  - $ref: '#/components/schemas/Error'

  /api/v1/work-items:
    get:
      summary: List work items
      description: |
        workitem/v1 (docs/work-context-contract.md). Without `state` lists open
        (non-terminal) items. A non-admin sees its tenants' `tenant` items and
        its own `private` ones; admins see every tenant unless `tenant` is set.
      tags: [Work Items]
      parameters:
        - {name: tenant, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string, enum: [open, active, waiting, completed, superseded, archived]}}
        - {name: owner, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        '200':
          description: Work items, most recently updated first
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  items: {type: array, items: {$ref: '#/components/schemas/WorkItem'}}
        '401': {description: Authentication required}
        '403': {description: No access to the tenant, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '503': {description: Work-items store not configured, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
    post:
      summary: Open a work item
      description: |
        Idempotent create-or-return. `Idempotency-Key` (header, or
        `idempotency_key` in the body) dedupes per tenant; an open item with the
        same `external_key` in the tenant is returned instead of a second one.
        The owner is the authenticated caller: a body naming an actor
        (`actor`, `owner_principal`, `created_by`, `on_behalf_of`, ...) is
        refused with 400 `actor_not_accepted`.
      tags: [Work Items]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant: {type: string}
                visibility: {type: string, enum: [tenant, private], default: tenant}
                origin_surface: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$', default: api}
                title: {type: string, maxLength: 256}
                external_key: {type: string, maxLength: 512}
                idempotency_key: {type: string, maxLength: 512}
              required: [tenant, title]
      responses:
        '201': {description: Opened, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemView'}}}}
        '200': {description: Replay or external_key dedupe; the existing item, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemView'}}}}
        '400': {description: Invalid body, a secret in text, or an actor field, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '401': {description: Authentication required}
        '403': {description: No access to the tenant, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '409': {description: Idempotency key reused, or external_key names open work the caller cannot see, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '503': {description: Work-items store not configured, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}:
    get:
      summary: Read one work item
      description: The item, its state_version and its latest execution. An item the caller may not see is 404.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Current state, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemView'}}}}
        '401': {description: Authentication required}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '503': {description: Work-items store not configured, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
    patch:
      summary: Transition a work item
      description: |
        `complete`, `archive`, `supersede` (needs `superseded_by`) or `wait`
        (needs `waiting_reason`). `expected_state_version` is required; a
        mismatch is 409 `state_version_conflict` with the current state and
        version. A transition outside the table is 409 `invalid_transition`.
        Resume has its own route.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: {type: string, enum: [complete, archive, supersede, wait]}
                waiting_reason: {type: string, enum: [input, approval]}
                superseded_by: {type: string}
                expected_state_version: {type: integer, format: int64}
                surface: {type: string}
                idempotency_key: {type: string}
              required: [action, expected_state_version]
      responses:
        '200': {description: Transitioned (or an idempotent replay), content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemView'}}}}
        '400': {description: Invalid request or an actor field, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '409': {description: 'state_version_conflict, invalid_transition or idempotency_key_reused', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/intents:
    post:
      summary: Append a bounded intent
      description: At most 8 KiB of text plus a JSON object of params, scanned for secrets. Never a transcript; history records the intent id only.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: {type: string, maxLength: 8192}
                params: {type: object}
                surface: {type: string}
                idempotency_key: {type: string}
              required: [text]
      responses:
        '201': {description: Appended}
        '200': {description: Idempotent replay}
        '400': {description: Too long, a secret, or an actor field, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '409': {description: The item is terminal, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/executions:
    get:
      summary: List a work item's executions
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Executions, oldest attempt first
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  executions: {type: array, items: {$ref: '#/components/schemas/WorkItemExecution'}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
    post:
      summary: Attach or correlate an execution
      description: |
        Attaches an engine run (`temporal` or `argo`), or records a later phase
        of one already attached under the same `(engine, engine_ref)`. At most
        one Pending/Running execution per item; a finished execution's phase
        never changes.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                engine: {type: string, enum: [temporal, argo]}
                engine_ref: {type: string, maxLength: 256}
                phase: {type: string, enum: [Pending, Running, Succeeded, Failed, Error], default: Pending}
                surface: {type: string}
                idempotency_key: {type: string}
              required: [engine, engine_ref]
      responses:
        '201': {description: Attached}
        '200': {description: Correlated or replayed}
        '400': {description: Invalid request or an actor field, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '409': {description: 'execution_active or invalid_transition', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/executions/{execution_id}/snapshot:
    get:
      summary: The context snapshot an execution sealed
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: execution_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The sealed snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  snapshot: {$ref: '#/components/schemas/ContextSnapshot'}
        '404': {description: 'work_item_not_found, or snapshot_not_found when this execution has not sealed one', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
    post:
      summary: Seal an execution's context snapshot
      description: |
        Insert-only. The retry identity is the execution: sealing the same
        bytes with the same strategy and prior references again returns the
        stored snapshot (200); different bytes or claims for the same
        execution are refused with `snapshot_divergence` and never stored.
        No `Idempotency-Key` is taken (400 if sent). `execution_sequence` is validation only and must equal the
        execution's attempt. A named prior execution or snapshot must exist
        on this work item and precede this execution. Only a service
        principal may seal; a person or a relayed surface gets 403.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: execution_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                execution_sequence: {type: integer, minimum: 1}
                canonical_b64: {type: string, format: byte, description: 'Base64 of the canonical JSON object bytes, at most 1 MiB decoded'}
                content_hash: {type: string, description: 'sha256:<hex> of the decoded bytes'}
                strategy: {type: string, maxLength: 512}
                strategy_version: {type: string, maxLength: 512}
                prior_execution_id: {type: string}
                prior_snapshot_id: {type: string}
              required: [execution_sequence, canonical_b64, content_hash, strategy, strategy_version]
      responses:
        '201':
          description: Sealed
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  snapshot: {$ref: '#/components/schemas/ContextSnapshot'}
        '200': {description: This execution already sealed these bytes; the stored snapshot}
        '400': {description: 'invalid_request (bad base64, hash mismatch, wrong sequence, not one JSON object) or actor_not_accepted', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '403': {description: snapshot_writer_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '404': {description: 'work_item_not_found or execution_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '409': {description: 'snapshot_divergence or prior_snapshot_invalid', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/snapshots:
    get:
      summary: List a work item's sealed context snapshots
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Snapshots, oldest execution first
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  snapshots:
                    type: array
                    description: Metadata only; read one snapshot for its bytes.
                    items: {$ref: '#/components/schemas/ContextSnapshotSummary'}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/snapshots/{snapshot_id}:
    get:
      summary: One sealed context snapshot
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: snapshot_id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  snapshot: {$ref: '#/components/schemas/ContextSnapshot'}
        '404': {description: 'work_item_not_found or snapshot_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/action-approvals:
    post:
      summary: Request approval of one runtime side effect
      description: |
        Service principal only, acting directly (a relayed surface or a person
        gets 403 `approval_requester_forbidden`); `requested_by` is the
        authenticated principal. The server computes `intent_hash`; a sent
        `intent_hash` must equal it (400 `intent_hash_mismatch`).
        Idempotent per (requested_by, idempotency_key), the key in the body or
        the `Idempotency-Key` header (they must agree): the same key with the
        same intent returns the stored request (200, whatever its state now),
        the same key with a different intent is 409
        `approval_idempotency_conflict`. Because a replay returns the stored
        request even once it is expired, denied or consumed, the key must vary
        per attempt (for example intent plus an attempt counter); a key
        derived from the intent alone can never request that action again.
        Every field is checked by the secret scanner (400
        `secret_in_text`). A new request needs `expires_at` in
        the future and at most 7 days ahead. A named `work_item_id` must exist.
      tags: [Action Approvals]
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                execution_id: {type: string, maxLength: 256}
                action_kind: {type: string, maxLength: 512}
                target: {type: string, maxLength: 2048}
                args_digest: {type: string, maxLength: 512}
                policy_rule_id: {type: string, maxLength: 512}
                policy_version: {type: string, maxLength: 512}
                artifact_hash: {type: string, maxLength: 512}
                work_item_id: {type: string, description: 'A wi_ id'}
                idempotency_key: {type: string, maxLength: 512}
                expires_at: {type: string, format: date-time}
                intent_hash: {type: string, description: Optional; verified against the server's hash}
              required: [execution_id, action_kind, target, args_digest, policy_rule_id, policy_version, expires_at]
      responses:
        '201': {description: Created in state pending, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalResponse'}}}}
        '200': {description: This key already names this intent; the stored request, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalResponse'}}}}
        '400': {description: 'invalid_request (missing or oversized field, expiry outside the window, unknown work item), secret_in_text, intent_hash_mismatch, or actor_not_accepted (a body naming requested_by or another actor)', content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '403': {description: approval_requester_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '409': {description: approval_idempotency_conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '503': {description: work_items_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
    get:
      summary: List action approval requests
      description: |
        Newest first. A human admin lists every request; a service principal
        lists the requests it made; anyone else gets 403
        `approval_reader_forbidden`. `state` filters on the effective state,
        so `expired` finds pending and approved requests past `expires_at`.
      tags: [Action Approvals]
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [pending, approved, denied, consumed, expired]}}
        - {name: execution_id, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string, enum: [actionapproval/v1]}
                  approvals:
                    type: array
                    items: {$ref: '#/components/schemas/ActionApprovalRequest'}
        '400': {description: invalid_request (unknown state or limit out of range), content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '403': {description: approval_reader_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '503': {description: work_items_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}

  /api/v1/action-approvals/{id}:
    get:
      summary: One action approval request
      description: |
        Read by a human admin, or by the service that requested it (another
        caller's request answers 404). The waiting workflow re-reads this
        after any wake-up; `state` applies lazy expiry.
      tags: [Action Approvals]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The request, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalResponse'}}}}
        '403': {description: approval_reader_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '404': {description: approval_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '503': {description: work_items_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}

  /api/v1/action-approvals/{id}/decision:
    post:
      summary: Approve or deny a pending action approval request
      description: |
        A human admin acting directly only: a service principal, a surface
        principal or a relayed request gets 403 `approval_decider_forbidden`,
        and the requester can never decide its own request (403
        `approval_self_decision`). `decided_by` is the authenticated
        principal. Only a pending, unexpired request is decided: otherwise
        409 `approval_already_decided` or `approval_expired`.
      tags: [Action Approvals]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                decision: {type: string, enum: [approve, deny]}
                reason: {type: string, maxLength: 1024}
              required: [decision]
      responses:
        '200': {description: Decided, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalResponse'}}}}
        '400': {description: 'invalid_request, secret_in_text (a credential in reason), or actor_not_accepted (a body naming decided_by)', content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '403': {description: 'approval_decider_forbidden or approval_self_decision', content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '404': {description: approval_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '409': {description: 'approval_already_decided or approval_expired', content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '503': {description: work_items_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}

  /api/v1/action-approvals/{id}/consume:
    post:
      summary: Spend an approved action approval request, exactly once
      description: |
        The requesting service only (anyone else 403
        `approval_requester_forbidden`; another service's request 404). One
        atomic compare-and-set from `approved` to `consumed`, which holds
        only while the stored `intent_hash` equals the presented one and the
        request has not expired; it records `consumed_at`. Of any number of
        concurrent consumes exactly one succeeds. A refusal is typed:
        `approval_not_approved` (pending), `approval_denied`,
        `approval_expired`, `approval_intent_mismatch`, `approval_consumed`.
        A consumed receipt never authorizes a second side effect.
      tags: [Action Approvals]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                intent_hash: {type: string}
              required: [intent_hash]
      responses:
        '200': {description: Consumed, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalResponse'}}}}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '403': {description: approval_requester_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '404': {description: approval_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '409': {description: 'approval_not_approved, approval_denied, approval_expired, approval_intent_mismatch or approval_consumed', content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}
        '503': {description: work_items_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ActionApprovalError'}}}}

  /api/v1/work-items/{id}/resume:
    post:
      summary: Resume a work item
      description: |
        Starts a new execution continuing a prior one (default: the latest).
        A waiting item becomes active and a `resumed` event is recorded;
        `resumed` is never a state. Refused on a terminal item, while an
        execution is Pending/Running, or with a stale `expected_state_version`.

        It names the engine run, so it is not a relay route. A surface asks
        for a resume with
        `POST /api/v1/work-items/{id}/execution-requests` instead
        (mctl-api#368).
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_state_version: {type: integer, format: int64}
                resumed_from_execution_id: {type: string}
                engine: {type: string, enum: [temporal, argo]}
                engine_ref: {type: string}
                surface: {type: string}
                idempotency_key: {type: string}
              required: [expected_state_version, engine, engine_ref]
      responses:
        '201': {description: Resumed; the item and the new execution}
        '200': {description: Idempotent replay; the execution the first request started}
        '400': {description: Invalid request or an actor field, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '409': {description: 'state_version_conflict, invalid_transition or execution_active', content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/execution-requests:
    post:
      summary: Request that a work item run
      description: |
        SURFACE REQUESTS EXECUTION; SURFACE DOES NOT DECLARE EXECUTION
        IDENTITY (mctl-api#368). A person acting directly, or a surface
        relaying for its linked human (a relay route), asks the execution
        platform to `start` the item's first run or `resume` it. The body
        names no engine, engine run or execution id: any of `engine`,
        `engine_ref`, `execution_id` is 400
        `execution_identity_not_accepted`, and an actor field is 400
        `actor_not_accepted`. `requested_by` is the authenticated principal
        (the linked human on relay) and `surface` is forced to the relaying
        surface. The service principal cannot create one (403
        `execution_request_requester_forbidden`).

        `start` needs an active item that has never run; `resume` needs an
        item that is waiting or has run, with no execution Pending or
        Running, and `resumed_from_execution_id` (default the latest) must be
        an execution of this item (404 `execution_not_found`). `intent_id`
        must be an intent of this item (404 `intent_not_found`).

        Idempotent per work item and key, bound to the actor (the
        `Idempotency-Key` header or `idempotency_key`): the same key and body
        return the stored request with 200, whatever its state now; a
        different body is 409 `idempotency_key_reused`. At most one open
        (`pending` or `claimed`) request per item: another is 409
        `execution_request_open` with the open request's id in `details`.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 512}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind: {type: string, enum: [start, resume]}
                expected_state_version: {type: integer, format: int64}
                resumed_from_execution_id: {type: string, description: 'resume only'}
                intent_id: {type: integer, format: int64, description: The intent that triggered the request}
                surface: {type: string}
                idempotency_key: {type: string, maxLength: 512}
              required: [kind, expected_state_version]
      responses:
        '201': {description: Recorded as pending, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestResponse'}}}}
        '200': {description: Idempotent replay; the stored request, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestResponse'}}}}
        '400': {description: 'invalid_request, execution_identity_not_accepted or actor_not_accepted', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '403': {description: execution_request_requester_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '404': {description: 'work_item_not_found (or not visible), execution_not_found or intent_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '409': {description: 'state_version_conflict, invalid_transition (terminal item, or the wrong kind), execution_active, idempotency_key_reused or execution_request_open', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '503': {description: work_items_unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
    get:
      summary: List a work item's execution requests
      description: Newest first, at most 100. Visible to whoever can see the item; a relay route.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string, enum: [workitem/v1]}
                  execution_requests: {type: array, items: {$ref: '#/components/schemas/ExecutionRequest'}}
        '404': {description: work_item_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}

  /api/v1/work-items/{id}/execution-requests/{request_id}:
    get:
      summary: Read one execution request
      description: Visible to whoever can see the item; a relay route.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: request_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: The request, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestResponse'}}}}
        '404': {description: 'work_item_not_found or execution_request_not_found', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}

  /api/v1/execution-requests/claim:
    post:
      summary: Claim the oldest claimable execution request
      description: |
        The execution platform only: the service principal acting directly
        (anyone else is 403 `execution_request_claimant_forbidden`; a
        surface never reaches it). Claims the oldest request that is
        `pending` or whose claim lease has lapsed, for `lease_seconds`
        (5-900, default 60), as one compare-and-set under the item's lock:
        however many claimants race, one wins. Every claim mints a new
        `claim_token`, which fulfil and reject must present; it is returned
        here only and never in a read. 204 when nothing is claimable.
      tags: [Work Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lease_seconds: {type: integer, minimum: 5, maximum: 900, default: 60}
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string, enum: [workitem/v1]}
                  execution_request: {$ref: '#/components/schemas/ExecutionRequest'}
                  claim_token: {type: string, description: Fences this claim; present it to fulfil or reject}
                required: [schema_version, execution_request, claim_token]
        '204': {description: Nothing is claimable}
        '400': {description: invalid_request (lease out of range), content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '403': {description: execution_request_claimant_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}

  /api/v1/execution-requests/{request_id}/fulfil:
    post:
      summary: Fulfil a claimed execution request
      description: |
        The claim holder only: the service principal that claimed it,
        presenting the current `claim_token` before `claim_expires_at` (a
        lapsed, foreign or superseded claim is 409
        `execution_request_not_claimed`). In one transaction it attaches the
        canonical execution and marks the request `fulfilled` with its
        `execution_id`: `start` attaches a Running execution (the
        `/executions` rule); `resume` follows `/resume` with the request's
        `expected_state_version` and `resumed_from_execution_id`, so a
        waiting item becomes active and `state_version` rises. A request whose
        item has since moved is refused with the item's 409 and stays claimed
        for the platform to reject. The holder repeating the same engine run
        gets the same execution (200); another run is 409
        `execution_request_closed`, as is fulfilling a rejected request.
      tags: [Work Items]
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                claim_token: {type: string}
                engine: {type: string, enum: [temporal, argo]}
                engine_ref: {type: string, maxLength: 256}
              required: [claim_token, engine, engine_ref]
      responses:
        '201':
          description: Fulfilled now
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string, enum: [workitem/v1]}
                  execution_request: {$ref: '#/components/schemas/ExecutionRequest'}
                  execution: {$ref: '#/components/schemas/WorkItemExecution'}
                  work_item: {$ref: '#/components/schemas/WorkItem'}
                  state_version: {type: integer, format: int64}
        '200': {description: The holder repeated the same engine run; the same execution}
        '400': {description: invalid_request, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '403': {description: execution_request_claimant_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '404': {description: execution_request_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '409': {description: 'execution_request_not_claimed, execution_request_closed, state_version_conflict, invalid_transition or execution_active', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}

  /api/v1/execution-requests/{request_id}/reject:
    post:
      summary: Reject a claimed execution request
      description: |
        The claim holder only, as fulfil. Closes the request without an
        execution; the item then takes a new request. `reason` is required,
        at most 1 KiB and secret-scanned (400 `secret_in_text`); it is kept
        on the request, never in events or audit. The holder repeating the
        same reason gets the rejected request (200); fulfilling or rejecting
        it otherwise is 409 `execution_request_closed`.
      tags: [Work Items]
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                claim_token: {type: string}
                reason: {type: string, maxLength: 1024}
              required: [claim_token, reason]
      responses:
        '200': {description: Rejected, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestResponse'}}}}
        '400': {description: 'invalid_request or secret_in_text', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '403': {description: execution_request_claimant_forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '404': {description: execution_request_not_found, content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}
        '409': {description: 'execution_request_not_claimed or execution_request_closed', content: {application/json: {schema: {$ref: '#/components/schemas/ExecutionRequestError'}}}}

  /api/v1/work-items/{id}/surface-refs:
    post:
      summary: Correlate a surface reference
      description: |
        Records a surface-native conversation for reply routing, or refreshes
        its last_seen_at. `actor_external_id` is correlation metadata only: it
        is never used as, or resolved to, the acting principal (that needs
        the surface-identity binding, mctl-api#350).

        This route is idempotent by (surface, external_id) and takes no
        `Idempotency-Key`: a request carrying that header answers 400.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                surface: {type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
                external_id: {type: string, maxLength: 256}
                actor_external_id: {type: string, maxLength: 256}
              required: [surface, external_id]
      responses:
        '201': {description: Linked}
        '200': {description: Already linked; last_seen_at refreshed}
        '400': {description: Invalid request or an actor field, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

  /api/v1/work-items/{id}/events:
    get:
      summary: Lifecycle history
      description: Append-only events. They carry ids, never intent text or surface external ids.
      tags: [Work Items]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Events in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema_version: {type: string}
                  events: {type: array, items: {$ref: '#/components/schemas/WorkItemEvent'}}
        '404': {description: No such work item, or not visible, content: {application/json: {schema: {$ref: '#/components/schemas/WorkItemError'}}}}

tags:
  - name: Health
    description: Health and readiness probes
  - name: Docs
    description: API documentation endpoints
  - name: Webhooks
    description: Signed inbound webhooks
  - name: Tenants
    description: Team workspace management
  - name: Services
    description: Service deployment and monitoring
  - name: Workflows
    description: Argo Workflow status
  - name: Resources
    description: Resource quota monitoring
  - name: Audit
    description: Audit log
  - name: Repos
    description: GitHub repository discovery
  - name: Operations
    description: Platform operation registry and execution
  - name: Platform Skills
    description: Platform-wide skill catalog and tenant bindings
  - name: Surface Identity
    description: |
      Verified links between surface-native identities and human principals
      (mctl-api#350). A surface principal (`surface:telegram`,
      `surface:portal`) calling a relay route names the end user in the
      `X-MCTL-Surface-Actor` header; the request then runs as the linked
      human (never admin) and is audited with both identities. Relay routes:
      GET /api/v1/human-input, GET /api/v1/human-input/{request_id},
      POST /api/v1/human-input/{request_id}/response, POST /api/v1/work-items,
      GET /api/v1/work-items/{id}, POST /api/v1/work-items/{id}/intents,
      POST /api/v1/work-items/{id}/surface-refs,
      GET|POST /api/v1/work-items/{id}/execution-requests,
      GET /api/v1/work-items/{id}/execution-requests/{request_id}. No relay
      route takes an engine, engine run or execution id: POST
      /api/v1/work-items/{id}/resume is not one (mctl-api#368).
      Unknown, revoked or expired links, another surface's link, or a missing
      header answer 403; the header from any other caller answers 400.
  - name: Roadmap
    description: Read-only roadmap publication (epic status and ready work items)
  - name: Agent Registry
    description: mctl-agents AgentManifest versions, releases, and promote/rollback
  - name: Work Items
    description: workitem/v1 durable work across surfaces (docs/work-context-contract.md)
  - name: Action Approvals
    description: actionapproval/v1 durable single-use approvals of runtime agent side effects (mctl-api#366)
