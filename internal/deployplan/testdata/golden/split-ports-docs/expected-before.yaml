blueGreen:
  enabled: false
dbInitJob:
  enabled: false
image:
  digest: ''
  repository: ghcr.io/acme/docs
  tag: rev-0123456789abcdef0123456789abcdef01234567
ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  className: traefik
  enabled: true
  hosts:
  - docs-abc123.mctl.ai
  tls:
  - hosts:
    - docs-abc123.mctl.ai
    secretName: preview-docs-abc123-tls
podLabels:
  mctl.ai/preview: 'true'
  mctl.ai/preview-id: abc123
probes:
  liveness:
    path: /healthz
  readiness:
    path: /healthz
service:
  containerPort: 8080
  port: 80
