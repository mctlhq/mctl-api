name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          # gosec runs as its own job in security.yml (it dominates runtime).
          args: --timeout 10m --disable gosec

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL 16 (max_connections=400)
        run: |
          docker run -d --name mctl-test-pg \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mctl_api_test \
            postgres:16 -c max_connections=400
          for i in $(seq 1 30); do
            if docker exec mctl-test-pg pg_isready -h 127.0.0.1 -p 5432 -U postgres -d mctl_api_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready in time"
          exit 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v5

      - name: install Chrome for the MCP Apps host harness
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -fsSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          command -v google-chrome

      - name: go build & test
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/mctl_api_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mctl_api_test?sslmode=disable
          # The stats view handshake test drives headless Chrome. Fail the job
          # if the browser is missing instead of skipping the harness.
          MCTL_REQUIRE_BROWSER: "1"
        run: |
          go build ./...
          # Run packages in parallel (-p 2) while isolating each package binary
          # into its own disposable Postgres database via cmd/pgtestexec so
          # unscoped cleanup statements (e.g. DELETE FROM alerts) never collide.
          go build -o "$RUNNER_TEMP/pgtestexec" ./cmd/pgtestexec
          go test -p 2 -exec "$RUNNER_TEMP/pgtestexec" ./...

      - name: bridge PostgreSQL tests (fail-closed evidence)
        shell: bash
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/mctl_api_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mctl_api_test?sslmode=disable
        run: |
          set -euo pipefail
          go test -p 1 -count=1 -v -run 'TestPG' ./internal/bridge/ | tee bridge-pg.log
          if grep -q -- '--- SKIP' bridge-pg.log; then echo 'PG bridge test skipped' >&2; exit 1; fi
          for t in TestPGOutboxLeaseDueOrderLimit TestPGOutboxConcurrentLeasersDisjoint TestPGOutboxTerminalStatesImmutable TestPGOutboxFromSubmitResult; do
            if ! grep -q -- "--- PASS: ${t} (" bridge-pg.log; then echo "missing required PG PASS: ${t}" >&2; exit 1; fi
          done
          grep -m1 'PostgreSQL:' bridge-pg.log || true

      - name: DeployIntent schema drift
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/deploy-intent.schema.json"
          gh api -H 'Accept: application/vnd.github.raw' \
            'repos/mctlhq/mctl-gitops/contents/platform-gitops/agent-platform/schemas/deploy-intent.schema.json?ref=main' > "$src"
          test -s "$src"
          DEPLOY_INTENT_SCHEMA_SOURCE="$src" go test -count=1 -run TestVendoredSchemaMatchesSource ./internal/deployanalyze/

      - name: deploy-plan upstream drift
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/deployplan-upstream"
          mkdir -p "$dir"
          for src in \
            platform-gitops/argo-workflows/cluster-templates/wft-preview-deploy.yaml \
            platform-gitops/argo-workflows/cluster-templates/tpl-git-commit.yaml \
            platform-gitops/argo-workflows/scripts/rewrite_preview_values.py; do
            out="$dir/$(basename "$src")"
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/mctlhq/mctl-gitops/contents/$src?ref=main" > "$out"
            test -s "$out"
          done
          DEPLOYPLAN_UPSTREAM_SOURCE_DIR="$dir" go test -count=1 -run 'TestUpstreamSnapshots' -v ./internal/deployplan/
