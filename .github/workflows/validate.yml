name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout 5m

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mctl_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v4

      - name: go build & test
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/mctl_api_test?sslmode=disable
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mctl_api_test?sslmode=disable
        run: |
          go build ./...
          # -p 1: internal/alerts and internal/api both run Postgres-backed
          # tests against the same TEST_DATABASE_URL and both issue unscoped
          # DELETE FROM alerts/alert_evidence in setup/cleanup. Running test
          # binaries for different packages in parallel (Go's default) would
          # let one package's cleanup wipe rows another package's test is
          # still asserting on. Forcing serial package execution avoids that
          # cross-package race entirely, at the cost of some CI wall time.
          go test -p 1 ./...

      - name: DeployIntent schema drift
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/deploy-intent.schema.json"
          gh api -H 'Accept: application/vnd.github.raw' \
            'repos/mctlhq/mctl-gitops/contents/platform-gitops/agent-platform/schemas/deploy-intent.schema.json?ref=main' > "$src"
          test -s "$src"
          DEPLOY_INTENT_SCHEMA_SOURCE="$src" go test -count=1 -run TestVendoredSchemaMatchesSource ./internal/deployanalyze/
