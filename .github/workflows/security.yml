name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Pinned to v1.7.0 (not @latest): now that this job is fail-closed, an
      # unpinned scanner release could turn every PR red with no change on
      # our side. The vulnerability database still floats at run time.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: govulncheck ./...

  # gosec is split out of validate.yml's lint job: its taint analysis is slow
  # on internal/api. Reads the shared .golangci.yml (same gosec excludes).
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Installed from the module (verified by the Go checksum database), not
      # through golangci-lint-action: v8 has no install-only input and would
      # run every linter here. Keep the version equal to validate.yml's.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      # The analysis of internal/api peaked at 15.5 GB on a 16 GB runner and
      # the runner was shut down. Collect garbage earlier and one package at a
      # time (slower, same rules), with swap as headroom.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /gosec-swap
          sudo chmod 600 /gosec-swap
          sudo mkswap /gosec-swap
          sudo swapon /gosec-swap
          free -h
      - name: gosec
        env:
          GOGC: "30"
          GOMEMLIMIT: 12GiB
        run: /usr/bin/time -v golangci-lint run --enable-only gosec --concurrency 2 --timeout 25m ./...

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Report-only scan: produces SARIF for Code Scanning and never fails on
      # findings. It runs before the gate so a failing gate cannot skip it.
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"
          ignore-unfixed: true
          version: v0.69.3
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3
      # Skipped for fork and Dependabot PRs, whose read-only token cannot upload.
      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
