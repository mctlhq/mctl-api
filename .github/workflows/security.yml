name: security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Pinned to v1.7.0 (not @latest): now that this job is fail-closed, an
      # unpinned scanner release could turn every PR red with no change on
      # our side. The vulnerability database still floats at run time.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: govulncheck
        run: govulncheck ./...

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3
