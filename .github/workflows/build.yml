name: build

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build & test
        run: |
          go build ./...
          go test ./...

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mctlhq/mctl-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # On semver tag: pin the new image version in GitOps repo
      - name: Update mctl-core image tag
        if: github.ref_type == 'tag'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/mctlhq/mctl-core.git /tmp/mctl-core
          cd /tmp/mctl-core
          python3 - <<'PYEOF'
          import re, os
          f = 'platform-gitops/apps/templates/mctl-api.yaml'
          version = os.environ['VERSION']
          content = open(f).read()
          content = re.sub(
              r'(repository: ghcr\.io/mctlhq/mctl-api\n\s+tag:)[^\n]+',
              r'\1 "' + version + '"',
              content
          )
          open(f, 'w').write(content)
          PYEOF
          git config user.email "ci@mctl.ai"
          git config user.name "mctl-ci"
          git add platform-gitops/apps/templates/mctl-api.yaml
          git diff --staged --quiet || git commit -m "chore: bump mctl-api to ${VERSION}"
          git push
