version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - gosec
    - bodyclose
    - nilerr

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
    gosec:
      excludes:
        - G104
        # G704 (SSRF): outbound HTTP calls in this codebase are either against
        # internal services configured at startup (BackstageInternalURL, MCP
        # apiURL) or against well-known fixed endpoints (github.com OAuth).
        # User-controlled segments are url.PathEscape/url.QueryEscape'd.
        # Taint analysis is too coarse to express this, so we rely on review
        # for new outbound HTTP sites instead of per-call #nosec annotations.
        - G704
