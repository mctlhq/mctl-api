run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - typecheck
    - gocritic
    - gosec
    - bodyclose
    - nilerr

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
    disabled-checks:
      - hugeParam
  gosec:
    excludes:
      - G104 # unhandled errors on w.Write in HTTP handlers (expected)

issues:
  exclude-rules:
    # Test files can be less strict.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
