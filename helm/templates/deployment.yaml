apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
            {{- if .Values.envFromExtraSecret }}
            - secretRef:
                name: {{ .Values.envFromExtraSecret }}
            {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.gitopsSSHSecret }}
            - name: GITOPS_SSH_KEY_PATH
              value: /etc/gitops-ssh/ssh-privatekey
            {{- end }}
            {{- with .Values.openclaw }}
            {{- with .skills }}
            {{- if .maxPerSkillBytes }}
            - name: OPENCLAW_SKILLS_MAX_PER_SKILL_BYTES
              value: {{ .maxPerSkillBytes | quote }}
            {{- end }}
            {{- if .maxPerTenant }}
            - name: OPENCLAW_SKILLS_MAX_PER_TENANT
              value: {{ .maxPerTenant | quote }}
            {{- end }}
            {{- if .maxTotalBytes }}
            - name: OPENCLAW_SKILLS_MAX_TOTAL_BYTES
              value: {{ .maxTotalBytes | quote }}
            {{- end }}
            {{- if .saveRatePerHour }}
            - name: OPENCLAW_SKILLS_SAVE_RATE_PER_HOUR
              value: {{ .saveRatePerHour | quote }}
            {{- end }}
            {{- end }}
            {{- with .identity }}
            {{- if .maxPerTenant }}
            - name: OPENCLAW_IDENTITY_MAX_PER_TENANT
              value: {{ .maxPerTenant | quote }}
            {{- end }}
            {{- if .maxTotalBytes }}
            - name: OPENCLAW_IDENTITY_MAX_TOTAL_BYTES
              value: {{ .maxTotalBytes | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: gitops-cache
              mountPath: /data/mctl-gitops
            {{- if .Values.gitopsSSHSecret }}
            - name: gitops-ssh
              mountPath: /etc/gitops-ssh
              readOnly: true
            {{- end }}
      volumes:
        - name: gitops-cache
          emptyDir:
            sizeLimit: 500Mi
        {{- if .Values.gitopsSSHSecret }}
        - name: gitops-ssh
          secret:
            secretName: {{ .Values.gitopsSSHSecret }}
            defaultMode: 0400
        {{- end }}
