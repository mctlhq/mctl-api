apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            {{- if .Values.envFromSecret }}
            - secretRef:
                name: {{ .Values.envFromSecret }}
            {{- end }}
            {{- if .Values.envFromExtraSecret }}
            - secretRef:
                name: {{ .Values.envFromExtraSecret }}
            {{- end }}
          env:
            {{- if and .Values.oidcProvidersSecret .Values.env.MCTL_OIDC_PROVIDERS }}
            {{- fail "set MCTL_OIDC_PROVIDERS either in env or through oidcProvidersSecret, not both" }}
            {{- end }}
            {{- if and .Values.zitadelLinkSecret (or .Values.env.ZITADEL_LINK_CLIENT_ID .Values.env.ZITADEL_LINK_CLIENT_SECRET) }}
            {{- fail "set ZITADEL_LINK_CLIENT_ID and ZITADEL_LINK_CLIENT_SECRET either in env or through zitadelLinkSecret, not both" }}
            {{- end }}
            {{- if and .Values.oauthZitadelSecret (or .Values.env.OAUTH_ZITADEL_CLIENT_ID .Values.env.OAUTH_ZITADEL_CLIENT_SECRET) }}
            {{- fail "set OAUTH_ZITADEL_CLIENT_ID and OAUTH_ZITADEL_CLIENT_SECRET either in env or through oauthZitadelSecret, not both" }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            {{- /* oidcProvidersSecret, zitadelLinkSecret and oauthZitadelSecret
                   supply these below; a literal entry (even an empty one)
                   would otherwise render a second entry with the same name,
                   which server-side apply refuses. */}}
            {{- if not (or (and $.Values.oidcProvidersSecret (eq $key "MCTL_OIDC_PROVIDERS"))
                           (and $.Values.zitadelLinkSecret (or (eq $key "ZITADEL_LINK_CLIENT_ID") (eq $key "ZITADEL_LINK_CLIENT_SECRET")))
                           (and $.Values.oauthZitadelSecret (or (eq $key "OAUTH_ZITADEL_CLIENT_ID") (eq $key "OAUTH_ZITADEL_CLIENT_SECRET")))) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.gitopsSSHSecret }}
            - name: GITOPS_SSH_KEY_PATH
              value: /etc/gitops-ssh/ssh-privatekey
            {{- end }}
            {{- if .Values.githubAppTokenSecret }}
            # The path, not the token. Naming the file is what lets the
            # process re-read it after a rotation.
            - name: GITHUB_APP_TOKEN_FILE
              value: /var/run/secrets/github/token
            {{- end }}
            {{- if .Values.usageWriterTokenSecret }}
            # Optional on purpose: a missing Secret leaves the usage-writer
            # principal disabled (only admins can write usage), it does not
            # keep the pod from starting.
            - name: MCTL_USAGE_WRITER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.usageWriterTokenSecret }}
                  key: MCTL_USAGE_WRITER_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.evidenceWriterTokenSecret }}
            # Optional on purpose: a missing Secret leaves the
            # evidence-writer principal disabled (only admins can write
            # evidence), it does not keep the pod from starting.
            - name: MCTL_EVIDENCE_WRITER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.evidenceWriterTokenSecret }}
                  key: MCTL_EVIDENCE_WRITER_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.registryPublisherTokenSecret }}
            # Optional on purpose: a missing Secret leaves the
            # registry-publisher principal disabled (only admins can publish
            # to the agent registry), it does not keep the pod from starting.
            - name: MCTL_REGISTRY_PUBLISHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registryPublisherTokenSecret }}
                  key: MCTL_REGISTRY_PUBLISHER_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.surfaceTelegramTokenSecret }}
            # Optional on purpose, same as the usage writer above: the chart ships
            # before mctl-gitops flips surfaceTelegramToken.enabled, so the Secret may
            # not exist yet. A missing Secret leaves the surface:telegram principal
            # disabled (relay calls 401) instead of holding the pod in
            # CreateContainerConfigError. The key matches the ExternalSecret
            # mctl-api-surface-telegram's secretKey.
            - name: MCTL_SURFACE_TELEGRAM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.surfaceTelegramTokenSecret }}
                  key: MCTL_SURFACE_TELEGRAM_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.surfacePortalTokenSecret }}
            # Optional for the same reason as the telegram token: a missing
            # Secret leaves the surface:portal principal disabled. The key
            # matches the ExternalSecret mctl-api-surface-portal's secretKey.
            - name: MCTL_SURFACE_PORTAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.surfacePortalTokenSecret }}
                  key: MCTL_SURFACE_PORTAL_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.oidcProvidersSecret }}
            # The federation registry (docs/federation.md). Optional on purpose:
            # mctl-gitops pre-creates the Secret empty and the zitadel-iac Job
            # fills it, so the key may be absent. An unset MCTL_OIDC_PROVIDERS
            # is today's Dex-only configuration, not a failure.
            - name: MCTL_OIDC_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidcProvidersSecret }}
                  key: MCTL_OIDC_PROVIDERS
                  optional: true
            {{- end }}
            {{- if .Values.zitadelLinkSecret }}
            # The confidential ZITADEL client of identity linking
            # (docs/principals.md, mctlhq/mctl-api#435), written by the
            # zitadel-iac Job. Optional: without both keys the link flow
            # answers 503 and nothing else changes.
            - name: ZITADEL_LINK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zitadelLinkSecret }}
                  key: ZITADEL_LINK_CLIENT_ID
                  optional: true
            - name: ZITADEL_LINK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.zitadelLinkSecret }}
                  key: ZITADEL_LINK_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- if .Values.oauthZitadelSecret }}
            # The confidential ZITADEL client of /oauth/authorize's ZITADEL
            # upstream (mctlhq/mctl-api#467), written by the zitadel-iac Job.
            # Optional: OAUTH_UPSTREAM=github ignores it, and zitadel or both
            # refuse to boot without it.
            - name: OAUTH_ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauthZitadelSecret }}
                  key: OAUTH_ZITADEL_CLIENT_ID
                  optional: true
            - name: OAUTH_ZITADEL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauthZitadelSecret }}
                  key: OAUTH_ZITADEL_CLIENT_SECRET
                  optional: true
            {{- end }}
            {{- if .Values.usagePricingConfigMap }}
            # The path, not the JSON. internal/usage/catalog_file.go reads this file
            # with os.ReadFile; a rate card is reviewed as a file in GitOps, and an env
            # value carrying the whole document would be unreviewable and would blow
            # past the env size a card will grow into.
            - name: USAGE_PRICING_CATALOG
              value: /etc/mctl-api/usage-pricing/catalog.json
            {{- end }}
            {{- with .Values.openclaw }}
            {{- with .skills }}
            {{- if .maxPerSkillBytes }}
            - name: OPENCLAW_SKILLS_MAX_PER_SKILL_BYTES
              value: {{ .maxPerSkillBytes | quote }}
            {{- end }}
            {{- if .maxPerTenant }}
            - name: OPENCLAW_SKILLS_MAX_PER_TENANT
              value: {{ .maxPerTenant | quote }}
            {{- end }}
            {{- if .maxTotalBytes }}
            - name: OPENCLAW_SKILLS_MAX_TOTAL_BYTES
              value: {{ .maxTotalBytes | quote }}
            {{- end }}
            {{- if .saveRatePerHour }}
            - name: OPENCLAW_SKILLS_SAVE_RATE_PER_HOUR
              value: {{ .saveRatePerHour | quote }}
            {{- end }}
            {{- end }}
            {{- with .identity }}
            {{- if .maxPerTenant }}
            - name: OPENCLAW_IDENTITY_MAX_PER_TENANT
              value: {{ .maxPerTenant | quote }}
            {{- end }}
            {{- if .maxTotalBytes }}
            - name: OPENCLAW_IDENTITY_MAX_TOTAL_BYTES
              value: {{ .maxTotalBytes | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: gitops-cache
              mountPath: /data/mctl-gitops
            - name: roadmap-state
              mountPath: /data/roadmap-state
            {{- if .Values.gitopsSSHSecret }}
            - name: gitops-ssh
              mountPath: /etc/gitops-ssh
              readOnly: true
            {{- end }}
            {{- if .Values.githubAppTokenSecret }}
            - name: github-app-token
              mountPath: /var/run/secrets/github
              readOnly: true
            {{- end }}
            {{- if and .Values.postgresCA .Values.postgresCA.secretName }}
            - name: cnpg-ca
              mountPath: /etc/cnpg
              readOnly: true
            {{- end }}
            {{- if .Values.usagePricingConfigMap }}
            - name: usage-pricing
              mountPath: /etc/mctl-api/usage-pricing
              readOnly: true
            {{- end }}
      volumes:
        - name: gitops-cache
          emptyDir:
            sizeLimit: 500Mi
        # A --depth=1 checkout of a few JSON files; the limit bounds loose
        # objects from repeated shallow fetches.
        - name: roadmap-state
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.gitopsSSHSecret }}
        - name: gitops-ssh
          secret:
            secretName: {{ .Values.gitopsSSHSecret }}
            # NOTE: same root:root problem as github-app-token above — at 0400
            # this lands unreadable by uid 1000. It has stayed invisible only
            # because gitopsSSHSecret is "" and production takes the HTTPS
            # branch. It deliberately does NOT get the 0444 fix: ssh(1) refuses
            # a private key that is group- or world-readable, so this one needs
            # securityContext.fsGroup on the pod instead — a change with a
            # wider blast radius than this chart has needed so far. Tracked in
            # mctlhq/mctl-api#307; fix it before anyone sets this value.
            defaultMode: 0400
        {{- end }}
        {{- if .Values.githubAppTokenSecret }}
        # A volume, not envFrom, and that is the entire point: this Secret is
        # re-synced every 30 minutes with a freshly minted installation token,
        # and environment variables are fixed when the container starts. An
        # envFrom consumer would serve an expired token within the hour. The
        # projected file changes in place and the process re-reads it.
        - name: github-app-token
          secret:
            secretName: {{ .Values.githubAppTokenSecret }}
            # 0444, not 0400. Kubelet writes secret volume files as root:root
            # unless the pod sets securityContext.fsGroup, and this chart sets
            # no securityContext at all while the image runs as uid 1000
            # (Dockerfile: adduser -u 1000, USER app:app). At 0400 the file
            # lands -r-------- root root and every read returns EACCES — and
            # because the credential source is bound once at startup and does
            # not fall through, the pod would never go Ready rather than
            # degrading. Same reasoning as postgresCA below, which is 0444 for
            # exactly this. The file is a bearer token inside the pod's own
            # mount namespace, read by the one process in the container.
            defaultMode: 0444
            items:
              - key: {{ .Values.githubAppTokenKey | default "token" }}
                path: token
        {{- end }}
        {{- if and .Values.postgresCA .Values.postgresCA.secretName }}
        - name: cnpg-ca
          secret:
            secretName: {{ .Values.postgresCA.secretName }}
            items:
              - key: {{ .Values.postgresCA.key | default "ca.crt" }}
                path: ca.crt
            defaultMode: 0444
        {{- end }}
        {{- if .Values.usagePricingConfigMap }}
        # optional: true on purpose, and it is the whole ordering story. The chart
        # ships first and mctl-gitops sets the value second, so there is a window
        # in which the name resolves to nothing. A non-optional ConfigMap volume
        # leaves the pod in ContainerCreating -- the control plane down over a rate
        # card, which is the opposite of what cmd/api/main.go decided when it chose
        # to log and continue on a load failure. Optional gives an empty directory,
        # LoadCatalogFile returns ENOENT, one ERROR is logged, and usage is still
        # recorded without a derived cost.
        #
        # A directory mount with items, not subPath: subPath copies are frozen at
        # container start, so a corrected card would need a delete rather than a
        # restart. No defaultMode override is needed -- unlike the Secret volumes
        # above, ConfigMap volume files land 0644 and are readable by uid 1000.
        - name: usage-pricing
          configMap:
            name: {{ .Values.usagePricingConfigMap }}
            optional: true
            items:
              - key: {{ .Values.usagePricingConfigMapKey | default "catalog.json" }}
                path: catalog.json
        {{- end }}
