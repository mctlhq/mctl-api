replicaCount: 1

image:
  repository: ghcr.io/mctlhq/mctl-api
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-credentials

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  tls: true
  hosts:
    - host: api.mctl.ai
    - host: api.mctl.me

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  GITOPS_REPO_URL: https://github.com/mctlhq/mctl-core.git
  GITOPS_BRANCH: main
  GITOPS_LOCAL_PATH: /data/mctl-core
  ARGOCD_URL: https://ops.mctl.me
  ARGO_WORKFLOWS_NAMESPACE: argo-workflows

# Name of an existing Secret to mount as envFrom (created by ExternalSecret)
envFromSecret: ""
