# OAUTH_JWT_SIGNING_KEYS (asymmetric access-token keys) arrives through the existing
# envFromSecret; see docs/access-token-signing.md.
replicaCount: 1

image:
  repository: ghcr.io/mctlhq/mctl-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-credentials

service:
  type: ClusterIP
  port: 8080
  # Extra Service annotations, e.g. Traefik sticky sessions. With more than
  # one replica the identity link flow (mctlhq/mctl-api#435) needs session
  # affinity: its challenges live in the memory of the pod that started them.
  # OAuth sign-ins do not: they use the shared flow store (OAUTH_DB_URL).
  annotations: {}

# Spread replicas across nodes, so one node going away does not take every
# replica with it. Empty renders nothing.
topologySpreadConstraints: []

ingress:
  enabled: true
  className: traefik
  tls: true
  hosts:
    - host: api.mctl.ai
    - host: api.mctl.me
  # Public paths only. /metrics is served on the ClusterIP Service for
  # in-cluster scrapes and is 404 from ingress (X-Forwarded-* guard).
  paths:
    - /healthz
    - /readyz
    - /openapi.yaml
    - /docs
    - /.well-known
    - /oauth
    # Browser half of ZITADEL identity linking (/identity/link/zitadel*,
    # mctlhq/mctl-api#435).
    - /identity
    - /api
    - /mcp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  # OAUTH_CIMD_ACCEPT=true resolves Client ID Metadata Documents and requires
  # OAUTH_CIMD_ALLOWED_HOSTS (comma list; ".example.com" matches subdomains);
  # an empty list refuses startup. OAUTH_CIMD_ADVERTISE=true (needs ACCEPT)
  # announces it in discovery. The retired OAUTH_CIMD_ENABLED refuses startup
  # when set. All are plain env entries.
  # Tracing (vendor-neutral OTLP): set OTEL_EXPORTER_OTLP_ENDPOINT to export
  # spans; unset (default) means no exporter, propagation still works.
  # OTEL_SDK_DISABLED=true forces export off. OTEL_MCTL_RECORD_ENDUSER=true
  # adds mctl.actor.* span attributes. A down Collector never affects responses.
  GITOPS_REPO_URL: https://github.com/mctlhq/mctl-gitops.git
  GITOPS_BRANCH: main
  GITOPS_LOCAL_PATH: /data/mctl-gitops
  # Roadmap publication checkout (mctl-api#333), on its own sized volume.
  ROADMAP_STATE_LOCAL_PATH: /data/roadmap-state
  ARGOCD_URL: https://ops.mctl.me
  ARGO_WORKFLOWS_NAMESPACE: argo-workflows
  # Federation registry (mctl-api#374, docs/federation.md). Empty means: no
  # explicit providers beyond the legacy DEX_ISSUER_URL/DEX_CLIENT_ID shim,
  # and the kill switch off. Set MCTL_OIDC_PROVIDERS to the JSON provider
  # array to add or replace an OIDC identity provider without a code change;
  # set MCTL_FEDERATION_DISABLED only to roll back to the pre-registry
  # authentication chain.
  MCTL_OIDC_PROVIDERS: ""
  MCTL_FEDERATION_DISABLED: ""
  # Commerce accept-only kill switch (mctl-api#570, docs/commerce-ledger.md
  # "Pausing acceptance"): refuses new quotes and accepts, keeps the drain live.
  COMMERCE_ACCEPT_DISABLED: ""
  # Tenant authorization key (mctl-api#377, docs/principals.md): empty or
  # "legacy" decides on the GitHub login; "shadow" also compares the
  # principal-keyed decision into metrics without acting on it; "principal"
  # decides on the principal (needs ADMIN_PRINCIPALS). Any other value
  # refuses boot.
  TENANT_AUTHZ_MODE: ""
  # Whether the mctl-agent service principal may still relay a free-text
  # approver on mctl-agents-approve (mctl-api#571). Empty or "true" keeps the
  # relay, audited per use as approver.legacy_relay; "false" refuses it once
  # mctl-agents approves through action-approval grants. Any other value
  # refuses boot. A relay carries no content digest, so since mctl-api#722 it
  # is refused with approval_content_unbound even when the flag is on
  # (counted as refused).
  MCTL_AGENTS_APPROVE_LEGACY_APPROVER: ""
  # How long an action approval stays spendable after a human decided it
  # (mctl-api#700), as a Go duration. Empty is 24h; it never extends past the
  # request's own expiry. 168h restores the previous 7-day horizon. An invalid
  # value refuses boot.
  ACTION_APPROVAL_MAX_DECISION_AGE: ""
  # "true" refuses to spend an approval whose policy rule is not registered in
  # the platform's policy set (mctl-api#700). Empty is off.
  ACTION_APPROVAL_REQUIRE_REGISTERED_POLICY: ""
  # Platform admins by principal id (prn_...), comma-separated. The only
  # source of platform admin in principal mode (ADMIN_USERS is then
  # ignored); in shadow mode, when set, each request's admin decision is
  # compared with it (admin_mismatch). A malformed entry refuses boot.
  ADMIN_PRINCIPALS: ""

# Optional CNPG CA for sslmode=verify-full. When set, ca.crt is mounted at
# /etc/cnpg/ca.crt and the process upgrades AUDIT_DB_URL to verify-full.
postgresCA:
  secretName: ""
  key: ca.crt

# Name of an existing Secret to mount as envFrom (created by ExternalSecret)
envFromSecret: ""

# Optional: mount an SSH private key for gitops repo access.
# If set, mounts the secret at /etc/gitops-ssh/ and sets GITOPS_SSH_KEY_PATH.
# The secret must have a key named "ssh-privatekey".
gitopsSSHSecret: ""
envFromExtraSecret: ""

# Optional: more Secrets mounted as envFrom with `optional: true`, so the pod
# still starts while one of them does not exist yet. For a Secret another
# controller fills in later, e.g. mctl-api-zitadel-hook, which ZITADEL's
# zitadel-iac writes after it creates the hook targets
# (docs/zitadel-identity-hook.md). envFrom is read at container start: after
# the Secret appears or changes, the pod needs a restart to see it.
envFromOptionalSecrets: []

# Optional: mount a GitHub App installation token as a file.
#
# If set, mounts the Secret at /var/run/secrets/github/token and sets
# GITHUB_APP_TOKEN_FILE, which the clone and the workflow dispatcher both
# re-read per use. Installation tokens live 60 minutes and the platform
# re-mints them every 30, so this must stay a file mount -- delivering the same
# value through envFromSecret would pin it at container start and it would
# expire in place.
githubAppTokenSecret: ""
# Key inside that Secret holding the token. Defaults to "token".
githubAppTokenKey: ""

# Optional: Secret holding MCTL_USAGE_WRITER_TOKEN, the bearer token of the
# usage-writer principal (service:mctl-agents-usage, mctlhq/.github#50). It
# may only append usage records. The reference is optional, so an absent
# Secret leaves the principal disabled rather than failing the pod.
usageWriterTokenSecret: ""

# Optional: Secret holding MCTL_SUPPORT_INCIDENT_PRODUCER_TOKEN, the bearer
# token of the support-incident-producer principal
# (service:mctl-support-incidents, mctl-api#830). It may only create
# source=support incidents. The reference is optional, so an absent Secret
# leaves the principal disabled rather than failing the pod.
supportIncidentProducerTokenSecret: ""

# Optional: Secret holding MCTL_EVIDENCE_WRITER_TOKEN, the bearer token of
# the evidence-writer principal (service:mctl-agents-evidence,
# mctl-api#409). It may only append execution-evidence records. The
# reference is optional, so an absent Secret leaves the principal disabled
# rather than failing the pod.
evidenceWriterTokenSecret: ""

# Optional: security providers for SecurityFinding ingest (mctl-api#774).
# A list of {ref, max_strength, tenants}: the provider's name, the strongest
# verification it may assert (deterministic_regression_test, assurance_replay,
# scanner_rerun_exact_revision, provider_claim or manual) and the tenants it
# may report for. Rendered into SECURITY_PROVIDERS. Empty leaves only admins
# able to ingest.
securityProviders: []
# Optional: Secret holding MCTL_SECURITY_PROVIDER_TOKENS, one "ref=token" line
# per provider listed above (tokens of at least 32 characters, unique across
# every principal). Each provider authenticates as
# service:security-provider:<ref> and may only call
# POST /api/v1/security/observations. The reference is optional, so an absent
# Secret leaves the providers disabled rather than failing the pod.
securityProviderTokensSecret: ""
# Optional: GitHub Code Scanning webhook receiver (mctl-api#802), rendered
# into SECURITY_GITHUB_CODE_SCANNING. Keys: repositories (full name -> tenant,
# tenants must belong to the github-code-scanning securityProviders entry),
# tools and actions (created, appeared_in_branch, reopened, reopened_by_user,
# fixed, closed_by_user). The dedicated HMAC secret
# GITHUB_CODE_SCANNING_WEBHOOK_SECRET is NOT set here; it is wired externally.
securityCodeScanning: {}

# Optional: Secret holding MCTL_REGISTRY_PUBLISHER_TOKEN, the bearer token of
# the registry-publisher principal (service:mctl-agents-registry-publisher,
# mctlhq/mctl-agents#470). It may only create an agent definition, publish a
# version and promote or roll back a release. The reference is optional, so
# an absent Secret leaves the principal disabled rather than failing the pod.
registryPublisherTokenSecret: ""

# Optional: Secret holding MCTL_SURFACE_TELEGRAM_TOKEN, the bearer token of
# the surface:telegram principal (mctlhq/mctl-telegram#443). mctl-api
# authenticates it in internal/auth/oidc.go (surfaceTokenEnv,
# minSurfaceTokenLen = 32); it may only speak for the telegram surface. The
# key inside the Secret is MCTL_SURFACE_TELEGRAM_TOKEN, which is what the
# mctl-gitops ExternalSecret mctl-api-surface-telegram produces. The
# reference is optional, so an absent Secret leaves the principal disabled
# rather than failing the pod.
surfaceTelegramTokenSecret: ""

# Optional: Secret holding MCTL_SURFACE_PORTAL_TOKEN, the bearer token of the
# surface:portal principal (mctlhq/mctl-portal#126). Same rules as the
# telegram token above (surfaceTokenEnv, minSurfaceTokenLen = 32); it may
# only speak for the portal surface. The key inside the Secret is
# MCTL_SURFACE_PORTAL_TOKEN, which is what the mctl-gitops ExternalSecret
# mctl-api-surface-portal produces. Optional, so an absent Secret leaves the
# principal disabled rather than failing the pod.
surfacePortalTokenSecret: ""

# Optional: Secret holding BACKSTAGE_GITHUB_APP_CONNECT_TOKEN, the static
# token mctl-api sends to the portal's github-app-connect /repo-binding
# lookup. The key inside the Secret is BACKSTAGE_GITHUB_APP_CONNECT_TOKEN,
# which is what the mctl-gitops ExternalSecret mctl-api-repo-binding
# produces. Optional: an absent Secret makes the lookup refuse, never allow.
repoBindingTokenSecret: ""

# Optional: Secret holding MCTL_OIDC_PROVIDERS, the JSON list of federated
# OIDC providers (docs/federation.md, mctlhq/mctl-api#434). In production
# mctl-gitops pre-creates it and the zitadel-iac Job writes the value, because
# the ZITADEL client id used as the audience is generated there and is not
# kept in git. Optional, so an absent Secret or key leaves the variable unset:
# the Dex-only configuration, unchanged.
oidcProvidersSecret: ""

# Optional: Secret holding ZITADEL_LINK_CLIENT_ID and
# ZITADEL_LINK_CLIENT_SECRET, the confidential ZITADEL client of explicit
# identity linking (docs/principals.md, mctlhq/mctl-api#435). In production
# the zitadel-iac Job writes both into the same Secret as
# MCTL_OIDC_PROVIDERS. Optional, so absent keys leave the link flow off
# (503) rather than failing the pod.
zitadelLinkSecret: ""

# Optional: Secret holding OAUTH_ZITADEL_CLIENT_ID and
# OAUTH_ZITADEL_CLIENT_SECRET, the confidential ZITADEL client (mctl-api-oauth)
# that /oauth/authorize signs people in with when OAUTH_UPSTREAM is zitadel
# or both (mctlhq/mctl-api#467). Optional keys: under the default
# OAUTH_UPSTREAM=github nothing reads them.
oauthZitadelSecret: ""

# Optional: mount a versioned usage rate card from a ConfigMap.
#
# When set, the ConfigMap is mounted read-only at
# /etc/mctl-api/usage-pricing and USAGE_PRICING_CATALOG points at
# catalog.json inside it, which is what makes usage rows carry
# calculated_cost and pricing_version (internal/usage/store.go). Empty by
# default: an unset value renders exactly the chart that shipped before.
#
# The ConfigMap is owned by mctl-gitops (mctlhq/mctl-gitops#1409), not by
# this chart -- a published price is a fact with an effective date and is
# reviewed there against the provider's page. The volume reference is
# optional, so a ConfigMap that has not landed yet degrades to "no
# calculated cost" (one ERROR log) instead of a pod stuck pulling a
# missing volume.
usagePricingConfigMap: ""
# Key inside that ConfigMap holding the rate-card JSON. Defaults to
# "catalog.json", the key mctl-gitops publishes.
usagePricingConfigMapKey: ""
