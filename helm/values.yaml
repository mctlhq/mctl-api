replicaCount: 1

image:
  repository: ghcr.io/mctlhq/mctl-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-credentials

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  tls: true
  hosts:
    - host: api.mctl.ai
    - host: api.mctl.me
  # Public paths only. /metrics is served on the ClusterIP Service for
  # in-cluster scrapes and is 404 from ingress (X-Forwarded-* guard).
  paths:
    - /healthz
    - /readyz
    - /openapi.yaml
    - /docs
    - /.well-known
    - /oauth
    - /api
    - /mcp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  GITOPS_REPO_URL: https://github.com/mctlhq/mctl-gitops.git
  GITOPS_BRANCH: main
  GITOPS_LOCAL_PATH: /data/mctl-gitops
  ARGOCD_URL: https://ops.mctl.me
  ARGO_WORKFLOWS_NAMESPACE: argo-workflows

# OpenClaw skill/identity save caps. Enforced in the save handlers
# (internal/api/handlers_openclaw.go) before any workflow submission.
# Aligns with the layered-skills plan (/docs/plans/openclaw-layered-skills.md):
# the K8s ConfigMap 1 MiB limit is the hard ceiling; these leave headroom for
# keys/metadata and protect the tenant from runaway agent edits.
openclaw:
  skills:
    # Max bytes in a single SKILL.md / identity file.
    maxPerSkillBytes: 102400
    # Max number of skill files per tenant.
    maxPerTenant: 100
    # Max total skill-file bytes per tenant (≤ ConfigMap 1 MiB headroom).
    maxTotalBytes: 921600
    # Max saves/deletes per hour per (team, user) — shared with identity.
    saveRatePerHour: 30
  identity:
    # Max identity overrides per tenant (hard cap is the 5-file allowlist).
    maxPerTenant: 5
    # Max total identity-file bytes per tenant.
    maxTotalBytes: 512000

# Optional CNPG CA for sslmode=verify-full. When set, ca.crt is mounted at
# /etc/cnpg/ca.crt and the process upgrades AUDIT_DB_URL to verify-full.
postgresCA:
  secretName: ""
  key: ca.crt

# Name of an existing Secret to mount as envFrom (created by ExternalSecret)
envFromSecret: ""

# Optional: mount an SSH private key for gitops repo access.
# If set, mounts the secret at /etc/gitops-ssh/ and sets GITOPS_SSH_KEY_PATH.
# The secret must have a key named "ssh-privatekey".
gitopsSSHSecret: ""
envFromExtraSecret: ""
